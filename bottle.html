<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>漂流瓶 · 望潮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 背景 ===== */
        .bg-layer {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 60%, #0a1525 0%, #061018 40%, #02060c 70%, #000 100%);
        }
        .bg-layer::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 80%, rgba(20, 60, 100, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 20%, rgba(30, 80, 120, 0.1) 0%, transparent 50%);
        }
        canvas#starfield { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .vignette {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 90%, rgba(0,0,0,0.8) 100%);
        }

        /* ===== 海浪动画 ===== */
        .wave-container {
            position: fixed; bottom: 0; left: 0; right: 0; height: 35vh; z-index: 3; pointer-events: none;
            overflow: hidden;
        }
        .wave {
            position: absolute; bottom: 0; left: -50%; width: 200%; height: 100%;
            background: radial-gradient(ellipse at center bottom, rgba(30, 80, 140, 0.12), transparent 70%);
            animation: waveMove 12s ease-in-out infinite;
        }
        .wave:nth-child(2) { animation-duration: 18s; animation-delay: -3s; opacity: 0.7; }
        .wave:nth-child(3) { animation-duration: 24s; animation-delay: -6s; opacity: 0.5; }
        @keyframes waveMove {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-5%) translateY(-10px); }
        }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative; z-index: 10;
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }

        /* ===== 返回按钮 ===== */
        .back-btn {
            position: fixed; top: 18px; left: 18px; z-index: 20;
            display: flex; align-items: center; gap: 6px;
            color: rgba(180, 210, 255, 0.5); font-size: 0.8rem;
            text-decoration: none; letter-spacing: 0.08em;
            transition: color 0.3s ease;
        }
        .back-btn:hover { color: rgba(180, 210, 255, 0.9); }
        .back-arrow { font-size: 1.2rem; }

        /* ===== 标题区 ===== */
        .title-zone { text-align: center; margin-bottom: 32px; }
        .title-main {
            font-size: 1.8rem; font-weight: 200; letter-spacing: 0.35em;
            color: rgba(220, 235, 255, 0.9);
            text-shadow: 0 0 30px rgba(80, 140, 220, 0.3);
        }
        .title-sub {
            font-size: 0.6rem; letter-spacing: 0.25em; margin-top: 8px;
            color: rgba(150, 180, 220, 0.4);
        }
        .title-poem {
            font-size: 0.72rem; margin-top: 16px; line-height: 1.8;
            color: rgba(160, 190, 220, 0.35); font-style: italic;
        }

        /* ===== 瓶子图标 ===== */
        .bottle-icon-zone {
            position: relative; margin-bottom: 28px;
            display: flex; justify-content: center;
        }
        .bottle-svg {
            width: 64px; height: 64px;
            animation: bottleFloat 4s ease-in-out infinite;
        }
        @keyframes bottleFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        /* ===== 按钮区 ===== */
        .action-zone {
            display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
        }
        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 180, 255, 0.15);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            font-family: inherit;
        }
        .action-btn:hover {
            background: rgba(120, 180, 255, 0.08);
            border-color: rgba(120, 180, 255, 0.35);
            box-shadow: 0 4px 30px rgba(80, 140, 220, 0.12);
            transform: translateY(-2px);
        }
        .action-btn:active { transform: scale(0.96); }
        .action-btn svg { width: 32px; height: 32px; }
        .action-btn .btn-label {
            font-size: 0.88rem; color: rgba(220, 235, 255, 0.85);
            letter-spacing: 0.15em;
        }
        .action-btn .btn-sub {
            font-size: 0.58rem; color: rgba(150, 180, 220, 0.4);
            letter-spacing: 0.1em;
        }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== 弹窗通用 ===== */
        .overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center; justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal-box {
            width: 90%; max-width: 400px;
            padding: 32px 24px;
            background: rgba(10, 18, 32, 0.95);
            border: 1px solid rgba(120, 180, 255, 0.15);
            border-radius: 20px;
            text-align: center;
            transform: scale(0.9); transition: transform 0.4s ease;
        }
        .overlay.show .modal-box { transform: scale(1); }

        /* ===== 扔瓶子弹窗 ===== */
        .throw-textarea {
            width: 100%; min-height: 120px; resize: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 180, 255, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: rgba(220, 235, 255, 0.9);
            font-size: 0.9rem; line-height: 1.7;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-appearance: none;
            -webkit-user-select: text;
            user-select: text;
            cursor: text;
        }
        .throw-textarea:focus {
            border-color: rgba(120, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(80, 140, 220, 0.1);
            background: rgba(255, 255, 255, 0.06);
        }
        .throw-textarea::placeholder {
            color: rgba(150, 180, 220, 0.25);
        }
        .char-count {
            text-align: right; font-size: 0.68rem;
            color: rgba(150, 180, 220, 0.3);
            margin-top: 6px;
        }
        .char-count.over { color: rgba(255, 120, 120, 0.6); }

        /* ===== 捞瓶子弹窗 ===== */
        .bottle-card {
            position: relative;
            padding: 28px 24px;
        }
        .bottle-card-icon {
            font-size: 1.8rem; margin-bottom: 16px;
            color: rgba(150, 200, 255, 0.5);
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.3);
        }
        .bottle-message {
            font-size: 0.95rem; line-height: 1.9;
            color: rgba(220, 235, 255, 0.88);
            padding: 16px 0;
            border-top: 1px solid rgba(120, 180, 255, 0.08);
            border-bottom: 1px solid rgba(120, 180, 255, 0.08);
            margin: 12px 0;
            word-break: break-word;
        }
        .bottle-time {
            font-size: 0.65rem; color: rgba(150, 180, 220, 0.3);
            letter-spacing: 0.1em;
        }
        .bottle-replies {
            margin-top: 16px; text-align: left;
        }
        .reply-item {
            font-size: 0.82rem; line-height: 1.7;
            color: rgba(180, 200, 220, 0.6);
            padding: 8px 12px; margin-top: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid rgba(120, 180, 255, 0.12);
            border-radius: 0 8px 8px 0;
            word-break: break-word;
        }
        .reply-label {
            font-size: 0.65rem; color: rgba(150, 180, 220, 0.3);
            letter-spacing: 0.1em; margin-bottom: 8px;
        }
        .reply-input-zone {
            margin-top: 20px; display: flex; gap: 8px;
        }
        .reply-input {
            flex: 1; padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 180, 255, 0.15);
            border-radius: 10px;
            color: rgba(220, 235, 255, 0.9);
            font-size: 0.85rem; font-family: inherit;
            outline: none; transition: border-color 0.3s ease;
        }
        .reply-input:focus { border-color: rgba(120, 180, 255, 0.4); }
        .reply-input::placeholder { color: rgba(150, 180, 220, 0.25); }

        /* ===== 通用按钮 ===== */
        .modal-btn {
            margin-top: 18px; padding: 12px 40px;
            background: rgba(120, 180, 255, 0.1);
            border: 1px solid rgba(120, 180, 255, 0.25);
            border-radius: 50px;
            color: rgba(220, 235, 255, 0.85);
            font-size: 0.88rem; letter-spacing: 0.2em;
            cursor: pointer; transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .modal-btn:hover {
            background: rgba(120, 180, 255, 0.18);
            border-color: rgba(120, 180, 255, 0.45);
            box-shadow: 0 0 20px rgba(80, 140, 220, 0.15);
            color: rgba(255, 255, 255, 1);
        }
        .modal-btn:active { transform: scale(0.95); }
        .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-btn.secondary {
            background: transparent;
            border-color: rgba(150, 180, 220, 0.12);
            color: rgba(150, 180, 220, 0.5);
        }
        .modal-btn.secondary:hover {
            border-color: rgba(150, 180, 220, 0.3);
            color: rgba(180, 210, 240, 0.8);
            box-shadow: none;
        }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-hint {
            font-size: 0.68rem; color: rgba(150, 180, 220, 0.3);
            letter-spacing: 0.12em; margin-top: 14px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 12px 28px; z-index: 300;
            background: rgba(10, 18, 32, 0.95);
            border: 1px solid rgba(120, 180, 255, 0.2);
            border-radius: 50px;
            color: rgba(220, 235, 255, 0.85);
            font-size: 0.82rem; letter-spacing: 0.1em;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* ===== 加载动画 ===== */
        .loading-spin {
            display: inline-block; width: 20px; height: 20px;
            border: 2px solid rgba(120, 180, 255, 0.15);
            border-top-color: rgba(120, 180, 255, 0.5);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 瓶子捞取动画 ===== */
        .salvage-anim {
            position: fixed; inset: 0; z-index: 250;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.7);
        }
        .salvage-anim.show { display: flex; }
        .salvage-anim .bottle-rise {
            animation: bottleRise 2.5s ease-out forwards;
        }
        @keyframes bottleRise {
            0% { transform: translateY(300px) rotate(0deg); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        /* ===== 空海提示 ===== */
        .empty-sea {
            text-align: center; padding: 20px;
        }
        .empty-sea-icon { font-size: 2rem; margin-bottom: 12px; color: rgba(150, 200, 255, 0.3); }
        .empty-sea-text { font-size: 0.82rem; color: rgba(150, 180, 220, 0.4); line-height: 1.8; }

        /* ===== 统计 ===== */
        .stats {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 15; text-align: center;
            font-size: 0.62rem; color: rgba(150, 180, 220, 0.25);
            letter-spacing: 0.15em;
        }

        /* ===== 管理员入口 ===== */
        .admin-entry {
            position: fixed; bottom: 16px; right: 18px; z-index: 20;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(150, 180, 220, 0.12);
            font-size: 1.1rem; cursor: pointer;
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            background: none; border: none; padding: 0;
            -webkit-appearance: none; font-family: inherit;
        }
        .admin-entry:hover { color: rgba(150, 180, 220, 0.4); }

        /* ===== 管理员面板 ===== */
        .admin-panel {
            width: 95%; max-width: 480px; max-height: 80vh;
            padding: 24px 20px;
            overflow-y: auto;
        }
        .admin-panel::-webkit-scrollbar { width: 3px; }
        .admin-panel::-webkit-scrollbar-track { background: transparent; }
        .admin-panel::-webkit-scrollbar-thumb { background: rgba(120,180,255,0.15); border-radius: 2px; }

        .admin-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid rgba(120, 180, 255, 0.1);
        }
        .admin-title {
            font-size: 1.1rem; font-weight: 300; letter-spacing: 0.2em;
            color: rgba(220, 235, 255, 0.9);
        }
        .admin-title-sub {
            font-size: 0.58rem; letter-spacing: 0.15em; margin-top: 4px;
            color: rgba(150, 180, 220, 0.35);
        }

        .admin-bottle-list {
            text-align: left; margin-bottom: 20px;
        }
        .admin-bottle-item {
            padding: 14px 16px; margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(120, 180, 255, 0.08);
            border-radius: 12px;
            transition: border-color 0.3s ease;
        }
        .admin-bottle-item:hover {
            border-color: rgba(120, 180, 255, 0.2);
        }
        .admin-bottle-content {
            font-size: 0.85rem; line-height: 1.7;
            color: rgba(220, 235, 255, 0.8);
            word-break: break-word;
        }
        .admin-bottle-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px;
        }
        .admin-bottle-info {
            font-size: 0.62rem; color: rgba(150, 180, 220, 0.3);
            letter-spacing: 0.08em;
        }
        .admin-bottle-del {
            padding: 4px 14px;
            background: rgba(255, 80, 80, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.15);
            border-radius: 8px;
            color: rgba(255, 120, 120, 0.6);
            font-size: 0.7rem; cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .admin-bottle-del:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.35);
            color: rgba(255, 150, 150, 0.9);
        }
        .admin-bottle-del:active { transform: scale(0.95); }

        .admin-replies {
            margin-top: 8px; padding-left: 12px;
        }
        .admin-reply-item {
            font-size: 0.78rem; line-height: 1.6;
            color: rgba(180, 200, 220, 0.5);
            padding: 6px 10px; margin-top: 4px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid rgba(120, 180, 255, 0.08);
            border-radius: 0 6px 6px 0;
            word-break: break-word;
        }

        .admin-actions {
            display: flex; gap: 12px; justify-content: center; margin-top: 20px;
        }
        .admin-btn-danger {
            padding: 10px 24px;
            background: rgba(255, 80, 80, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.2);
            border-radius: 50px;
            color: rgba(255, 150, 150, 0.7);
            font-size: 0.78rem; letter-spacing: 0.15em;
            cursor: pointer; transition: all 0.3s ease;
            font-family: inherit;
        }
        .admin-btn-danger:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.4);
            color: rgba(255, 180, 180, 0.9);
        }
        .admin-btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

        .admin-login-input {
            width: 100%; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 180, 255, 0.15);
            border-radius: 12px;
            color: rgba(220, 235, 255, 0.9);
            font-size: 0.88rem; font-family: inherit;
            outline: none; text-align: center;
            letter-spacing: 0.1em;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .admin-login-input:focus {
            border-color: rgba(120, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(80, 140, 220, 0.1);
        }
        .admin-login-input::placeholder {
            color: rgba(150, 180, 220, 0.2);
            letter-spacing: 0.05em;
        }

        .admin-empty {
            text-align: center; padding: 30px 20px;
            font-size: 0.82rem; color: rgba(150, 180, 220, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <canvas id="starfield"></canvas>
    <div class="vignette"></div>
    <div class="wave-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <a href="index.html" class="back-btn">
        <span class="back-arrow">←</span>
        <span>回到星海</span>
    </a>

    <div class="main-container">
        <div class="title-zone">
            <div class="title-main">漂流瓶</div>
            <div class="title-sub">DRIFTING BOTTLE</div>
            <div class="title-poem">
                扔一句话进海 · 潮水当邮差<br>
                你不知道谁会捡到 · 也不知道谁扔的
            </div>
        </div>

        <div class="bottle-icon-zone">
            <svg class="bottle-svg" viewBox="0 0 64 64" fill="none">
                <path d="M24 8 L40 8 L40 14 L44 18 L44 48 C44 52 42 56 38 56 L26 56 C22 56 20 52 20 48 L20 18 L24 14 Z"
                      stroke="rgba(120,180,255,0.4)" stroke-width="1.5" fill="rgba(120,180,255,0.04)"/>
                <rect x="28" y="12" width="8" height="2" rx="1" fill="rgba(120,180,255,0.3)"/>
                <circle cx="32" cy="34" r="1.5" fill="rgba(150,200,255,0.4)"/>
            </svg>
        </div>

        <div class="action-zone">
            <button class="action-btn" id="throwBtn">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2 L12 22 M6 8 L12 2 L18 8" stroke="rgba(120,180,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="btn-label">扔进海里</span>
                <span class="btn-sub">THROW</span>
            </button>
            <button class="action-btn" id="salvageBtn">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 22 L12 2 M6 16 L12 22 L18 16" stroke="rgba(120,180,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="btn-label">捞一个</span>
                <span class="btn-sub">SALVAGE</span>
            </button>
        </div>
    </div>

    <div class="stats" id="stats">海中有 0 个瓶子在漂流</div>

    <!-- 扔瓶子弹窗 -->
    <div class="overlay" id="throwOverlay">
        <div class="modal-box">
            <div style="font-size:1.3rem; margin-bottom:8px; color:rgba(150,200,255,0.5);">✧</div>
            <div style="font-size:0.78rem; color:rgba(180,200,230,0.5); letter-spacing:0.15em; margin-bottom:20px;">写下你想扔进海里的话</div>
            <textarea class="throw-textarea" id="throwInput" placeholder="可以是烦恼 可以是憋着不敢说的&#10;也可以是无聊的碎碎念&#10;扔完就沉了 潮水会带它去远方" maxlength="300" enterkeyhint="send"></textarea>
            <div class="char-count"><span id="charCount">0</span>/300</div>
            <div class="modal-btns">
                <button class="modal-btn secondary" id="throwCancel">取消</button>
                <button class="modal-btn" id="throwSend">扔出去</button>
            </div>
        </div>
    </div>

    <!-- 捞瓶子动画 -->
    <div class="salvage-anim" id="salvageAnim">
        <svg class="bottle-svg bottle-rise" viewBox="0 0 64 64" fill="none" style="width:80px;height:80px;">
            <path d="M24 8 L40 8 L40 14 L44 18 L44 48 C44 52 42 56 38 56 L26 56 C22 56 20 52 20 48 L20 18 L24 14 Z"
                  stroke="rgba(120,180,255,0.5)" stroke-width="1.5" fill="rgba(120,180,255,0.06)"/>
            <rect x="28" y="12" width="8" height="2" rx="1" fill="rgba(120,180,255,0.3)"/>
        </svg>
    </div>

    <!-- 捞到瓶子弹窗 -->
    <div class="overlay" id="salvageOverlay">
        <div class="modal-box bottle-card" id="bottleCard">
            <!-- 动态填充 -->
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 管理员入口 -->
    <button class="admin-entry" id="adminEntry" title="管理">⚙</button>

    <!-- 管理员弹窗 -->
    <div class="overlay" id="adminOverlay">
        <div class="modal-box admin-panel" id="adminPanel">
            <!-- 动态填充 -->
        </div>
    </div>

    <script>
        // ===== 星空背景 =====
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            var count = Math.floor((canvas.width * canvas.height) / 12000);
            for (var i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 0.8 + 0.2,
                    tw: Math.random() * Math.PI * 2,

            if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';

                })
            ]);

        updateStats();
