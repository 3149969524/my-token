<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 一座岛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: rgba(100,180,255,0.9);
            --primary-dark: rgba(60,120,255,0.8);
            --accent: rgba(150,200,255,1);
            --dark: rgba(255,255,255,0.9);
            --light: #0a0418;
            --gray: rgba(255,255,255,0.5);
            --white: rgba(15,10,35,0.65);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --gradient: linear-gradient(135deg, rgba(100,180,255,0.25) 0%, rgba(60,120,255,0.15) 100%);
            --danger: #e74c3c;
            --glass-border: rgba(100,180,255,0.15);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background: var(--light);
            background-image: url('galaxy_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 半透明遮罩层 - 让内容更聚焦 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(5,2,15,0.3) 0%, rgba(5,2,15,0.6) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: rgba(10, 5, 25, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(100,180,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 20px;
        }
        .navbar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        .navbar-logo {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
        }
        .navbar-links {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .navbar-links::-webkit-scrollbar { display: none; }
        .navbar-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 8px;
            border-radius: 8px;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .navbar-links a:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .navbar-links a.active { color: #fff; background: rgba(255,255,255,0.15); }

        /* ===== 顶部横幅 ===== */
        .banner {
            background: transparent;
            color: var(--white);
            text-align: center;
            padding: 50px 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(100,180,255,0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: bannerMove 20s linear infinite;
        }

        @keyframes bannerMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .banner-content { position: relative; z-index: 2; }
        .banner h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; text-shadow: 0 0 20px rgba(100,180,255,0.5); }
        .banner p { font-size: 1.1rem; opacity: 0.7; }
        .banner .underline { width: 60px; height: 2px; background: rgba(100,180,255,0.4); border-radius: 2px; margin: 15px auto 0; }

        /* ===== 管理员标志 ===== */
        .admin-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* ===== 留言板主体 ===== */
        .board-container { max-width: 750px; margin: 0 auto; padding: 40px 20px; }

        .message-input-area {
            background: rgba(15, 10, 35, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-input-area input,
        .message-input-area textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(100,180,255,0.15);
            background: rgba(5, 2, 15, 0.5);
            color: rgba(255,255,255,0.9);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .message-input-area input::placeholder,
        .message-input-area textarea::placeholder { color: rgba(255,255,255,0.3); }

        .message-input-area input:focus,
        .message-input-area textarea:focus { outline: none; border-color: rgba(100,180,255,0.5); }
        .message-input-area textarea { resize: vertical; min-height: 80px; }

        .message-submit-btn {
            align-self: flex-end;
            padding: 10px 30px;
            background: linear-gradient(135deg, rgba(100,180,255,0.3) 0%, rgba(60,120,255,0.2) 100%);
            color: rgba(255,255,255,0.95);
            border: 1px solid rgba(100,180,255,0.2);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .message-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(100,180,255,0.2); }
        .message-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ===== 留言列表 ===== */
        .messages-list { display: flex; flex-direction: column; gap: 16px; }

        .message-item {
            background: rgba(15, 10, 35, 0.55);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 16px 20px;
            border-left: 2px solid rgba(100,180,255,0.4);
            border: 1px solid rgba(100,180,255,0.08);
            border-left: 2px solid rgba(100,180,255,0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-item:hover { transform: translateX(4px); border-left-color: rgba(100,180,255,0.7); box-shadow: 0 4px 25px rgba(100,180,255,0.1); }
        .message-item.selected { border-left-color: var(--danger); background: rgba(60,10,15,0.6); }

        /* 管理员勾选框 */
        .msg-checkbox {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--danger);
        }

        .msg-body { flex: 1; min-width: 0; }

        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .message-item .msg-name { font-weight: 600; color: rgba(255,255,255,0.95); font-size: 0.95rem; }
        .message-item .msg-time { color: rgba(255,255,255,0.4); font-size: 0.8rem; }
        .message-item .msg-content { color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.5; word-break: break-word; }

        /* ===== 管理员单条删除按钮 ===== */
        .msg-delete-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            color: #fff;
            font-size: 0.68rem;
            padding: 1px 8px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: 600;
        }
        .message-item.pinned {
            border-left: 3px solid rgba(100,180,255,0.6);
            background: linear-gradient(135deg, rgba(100,180,255,0.08) 0%, rgba(15,10,35,0.55) 100%);
        }

        .msg-admin-actions {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(100,180,255,0.1);
            display: flex;
            justify-content: flex-end;
        }

        /* ===== 回复功能 ===== */
        .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .msg-reply-btn {
            background: none;
            border: none;
            color: rgba(100,180,255,0.7);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s;
        }
        .msg-reply-btn:hover { color: rgba(150,200,255,1); text-decoration: underline; }

        .msg-reply-area {
            margin-top: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .msg-reply-area.show { display: flex; }
        .msg-reply-area input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(100,180,255,0.15);
            background: rgba(5, 2, 15, 0.5);
            color: rgba(255,255,255,0.9);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .msg-reply-area input::placeholder { color: rgba(255,255,255,0.3); }
        .msg-reply-area input:focus { outline: none; border-color: rgba(100,180,255,0.5); }
        .msg-reply-submit {
            align-self: flex-end;
            padding: 6px 18px;
            background: linear-gradient(135deg, rgba(100,180,255,0.3) 0%, rgba(60,120,255,0.2) 100%);
            color: rgba(255,255,255,0.95);
            border: 1px solid rgba(100,180,255,0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .msg-reply-submit:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(100,180,255,0.2); }
        .msg-reply-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .msg-replies {
            margin-top: 10px;
            padding-left: 14px;
            border-left: 2px solid rgba(100,180,255,0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-reply-item {
            background: rgba(5, 2, 15, 0.4);
            border: 1px solid rgba(100,180,255,0.08);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.88rem;
        }
        .msg-reply-item .msg-reply-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .msg-reply-item .msg-reply-name { font-weight: 600; color: rgba(150,200,255,0.9); font-size: 0.85rem; }
        .msg-reply-item .msg-reply-time { color: rgba(255,255,255,0.35); font-size: 0.75rem; }
        .msg-reply-item .msg-reply-content { color: rgba(255,255,255,0.7); line-height: 1.4; word-break: break-word; }
        .msg-reply-item .msg-reply-delete {
            background: rgba(231,76,60,0.8);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .msg-reply-item .msg-reply-delete:hover { background: #c0392b; transform: scale(1.05); }

        .message-empty {
            text-align: center; color: rgba(255,255,255,0.4); padding: 50px 30px;
            font-size: 1rem; background: rgba(15,10,35,0.5); backdrop-filter: blur(15px);
            border: 1px solid rgba(100,180,255,0.08);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .message-count { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 16px; }

        /* ===== 固定底部栏 ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            z-index: 999;
            background: rgba(10, 5, 25, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(100,180,255,0.1);
            padding: 12px 20px;
        }
        .bottom-bar-inner {
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .bottom-bar-text {
            color: rgba(255,255,255,0.6);
            font-size: 0.82rem;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* 管理员退出按钮（底部栏内） */
        .admin-logout-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
            display: none;
        }

        /* 管理员批量操作栏 */
        .admin-batch-bar {
            display: none;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-batch-bar.show { display: flex; }

        .batch-select-all {
            display: flex;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.8);
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
        }
        .batch-select-all input { width: 16px; height: 16px; accent-color: var(--danger); cursor: pointer; }

        .batch-count {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }

        .batch-delete-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .batch-delete-btn:hover { background: #c0392b; }
        .batch-delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .batch-cancel-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .batch-cancel-btn:hover { background: rgba(255,255,255,0.25); }

        /* ===== 管理员搜索栏 ===== */
        .admin-search-bar {
            display: none;
            align-items: center;
            gap: 8px;
            max-width: 750px;
            margin: 0 auto 12px;
        }
        .admin-search-bar.show { display: flex; }
        .admin-search-bar input {
            flex: 1;
            padding: 10px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        .admin-search-bar input:focus { border-color: var(--primary); }
        .admin-search-bar input::placeholder { color: #aaa; }
        .admin-search-clear {
            background: var(--danger);
            color: #fff;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .admin-search-clear:hover { background: #c0392b; }

        /* 搜索关键词高亮 */
        .msg-content mark, .msg-name mark {
            background: #ffe082;
            color: #e65100;
            padding: 0 3px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* ===== 管理员登录弹窗 ===== */
        .admin-modal {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: all 0.3s;
        }
        .admin-modal.show { opacity: 1; visibility: visible; }

        .admin-modal-box {
            background: rgba(15, 10, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 16px;
            padding: 30px;
            width: 90%; max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .admin-modal.show .admin-modal-box { transform: translateY(0); }

        .admin-modal-box h3 { text-align: center; margin-bottom: 20px; font-size: 1.3rem; padding-right: 30px; color: rgba(255,255,255,0.95); }
        .admin-close-btn {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; font-size: 1.4rem;
            color: rgba(255,255,255,0.4); cursor: pointer; line-height: 1;
        }
        .admin-close-btn:hover { color: var(--danger); }
        .admin-modal-box input {
            width: 100%; padding: 12px 16px;
            border: 1px solid rgba(100,180,255,0.15); border-radius: 10px;
            background: rgba(5, 2, 15, 0.5);
            color: rgba(255,255,255,0.9);
            font-size: 1rem; margin-bottom: 12px;
        }
        .admin-modal-box input::placeholder { color: rgba(255,255,255,0.3); }
        .admin-modal-box input:focus { outline: none; border-color: rgba(100,180,255,0.5); }
        .admin-modal-box button { width: 100%; }
        .admin-modal-box .admin-hint { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 12px; }
        .admin-modal-box .admin-error { color: var(--danger); font-size: 0.85rem; text-align: center; margin-top: 8px; display: none; }

        /* ===== 回到顶部按钮 ===== */
        .back-to-top {
            position: fixed; right: 25px; bottom: 90px;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(10, 5, 25, 0.85);
            backdrop-filter: blur(15px);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(100,180,255,0.2);
            font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 997; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transform: translateY(10px);
        }
        .back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { background: rgba(100,180,255,0.2); border-color: rgba(100,180,255,0.5); transform: scale(1.1); }

    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">一座岛</a>
            <div class="navbar-links">
                <a href="index.html">首页</a>
                <a href="board.html" class="active">留言板</a>
                <a href="yu.html">屿语</a>
                <a href="yu.html#capsule">时间胶囊</a>
                <a href="about.html">关于</a>
            </div>
        </div>
    </nav>

    <!-- ===== 顶部横幅 ===== -->
    <header class="banner">
        <div class="banner-content">
            <h1>留言板<span id="adminBadge" class="admin-badge" style="display:none;">管理员</span></h1>
            <p>留下你的足迹，说说你想说的</p>
            <div class="underline"></div>
        </div>
    </header>

    <!-- ===== 留言板主体 ===== -->
    <main class="board-container">
        <div class="message-input-area">
            <input type="text" id="boardName" placeholder="你的昵称（可选）" maxlength="20">
            <textarea id="boardMsg" placeholder="写下你的留言..." maxlength="500"></textarea>
            <button class="message-submit-btn" id="boardSubmit">发布留言 ✈</button>
        </div>
        <div class="message-count" id="msgCount"></div>
        <!-- 管理员搜索栏 -->
        <div class="admin-search-bar" id="adminSearchBar">
            <input type="text" id="adminSearchInput" placeholder="🔍 输入关键字搜索留言（昵称或内容）..." maxlength="30">
            <button class="admin-search-clear" id="adminSearchClear" title="清除搜索">✕</button>
        </div>
        <div class="messages-list" id="boardList">
            <div class="message-empty">留言加载中... ⏳</div>
        </div>
    </main>

    <!-- ===== 固定底部栏（始终在屏幕底部）===== -->
    <div class="bottom-bar">
        <div class="bottom-bar-inner">
            <!-- 非管理员状态：显示页脚文字（连点5次进管理员） -->
            <span class="bottom-bar-text" id="footerText">留言板 · 永久在线</span>

            <!-- 管理员批量操作栏 -->
            <div class="admin-batch-bar" id="adminBatchBar">
                <label class="batch-select-all">
                    <input type="checkbox" id="selectAllCheckbox">
                    <span>全选</span>
                </label>
                <span class="batch-count" id="batchCount">已选 0 条</span>
                <button class="batch-delete-btn" id="batchDeleteBtn" disabled>🗑 批量删除</button>
                <button class="batch-cancel-btn" id="batchCancelBtn">取消</button>
            </div>

            <!-- 管理员退出按钮 -->
            <button class="admin-logout-btn" id="adminLogoutBtn">退出管理员</button>
        </div>
    </div>

    <!-- ===== 管理员登录弹窗 ===== -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-modal-box" style="position:relative;">
            <button class="admin-close-btn" id="adminCloseBtn">✕</button>
            <h3>🔒 管理员验证</h3>
            <input type="password" id="adminPwdInput" placeholder="请输入管理员密码" maxlength="30">
            <button class="message-submit-btn" id="adminLoginBtn" style="width:100%;">验证身份</button>
            <p class="admin-error" id="adminError">密码错误，请重试</p>

    <script>
        // ===== 留言系统（GitHub 存储 + CDN加速 + 管理员模式）=====
        var GH_TOKEN = ['github_pat_','11CR3NF3I0','ZBJzKgb1Dn','LH_A156182','be1TmOD1JT','bcwxbcYDTx','4acfp6lzoO','g1V3RdHUVG','TG5WQv5Hgu','II'].join('');

        var PURGE_URL = 'https://purge.jsdelivr.net/gh/' + GH_OWNER + '/' + GH_REPO + '@main/' + GH_FILE;
        var MAX_MSGS = 200;

        // ===== 防刷屏巡查系统 =====
        var SPAM_WINDOW_MS = 60000;   // 60秒窗口期
        var SPAM_MAX_POSTS = 3;       // 窗口内最多发3条
        var SPAM_TRACKER = {};        // { key: [{content, time}] }

        function getSpamKey(name, content) {
            // 用昵称+内容前50字符作为指纹
            return (name || '匿名访客') + '|' + (content || '').substring(0, 50).trim();
        }

        function checkSpam(name, content, isReply) {
            if (isAdmin) return null; // 管理员豁免

            var key = getSpamKey(name, content);
            var now = Date.now();
            var records = SPAM_TRACKER[key] || [];

            // 清理过期记录
            records = records.filter(function(r) { return now - r.time < SPAM_WINDOW_MS; });

            // 1. 重复内容检测：完全相同的留言/回复内容
            var dupKey = (name || '匿名访客') + '|' + (content || '').trim();
            var dupRecords = (SPAM_TRACKER['__dup__'] || []).filter(function(r) {
                return now - r.time < SPAM_WINDOW_MS && r.key === dupKey;
            });

            if (dupRecords.length >= 2) {
                return '检测到重复内容刷屏，请勿发送相同内容！🚫';
            }

            // 2. 连续发帖上限检测
            // 用昵称维度统计
            var nameKey = '__name__' + (name || '匿名访客');
            var nameRecords = (SPAM_TRACKER[nameKey] || []).filter(function(r) {
                return now - r.time < SPAM_WINDOW_MS;
            });

            if (nameRecords.length >= SPAM_MAX_POSTS) {
                var waitSec = Math.ceil((SPAM_WINDOW_MS - (now - nameRecords[0].time)) / 1000);
                return '发送过于频繁，请 ' + waitSec + ' 秒后再试！⏳';
            }

            return null; // 通过检查
        }

        function recordSpam(name, content) {
            if (isAdmin) return;
            var now = Date.now();
            var dupKey = (name || '匿名访客') + '|' + (content || '').trim();

            // 记录内容指纹
            var key = getSpamKey(name, content);
            if (!SPAM_TRACKER[key]) SPAM_TRACKER[key] = [];
            SPAM_TRACKER[key].push({ content: content, time: now });
            SPAM_TRACKER[key] = SPAM_TRACKER[key].filter(function(r) { return now - r.time < SPAM_WINDOW_MS; });

            // 记录重复检测
            if (!SPAM_TRACKER['__dup__']) SPAM_TRACKER['__dup__'] = [];
            SPAM_TRACKER['__dup__'].push({ key: dupKey, time: now });
            SPAM_TRACKER['__dup__'] = SPAM_TRACKER['__dup__'].filter(function(r) { return now - r.time < SPAM_WINDOW_MS; });

            // 记录昵称维度
            var nameKey = '__name__' + (name || '匿名访客');
            if (!SPAM_TRACKER[nameKey]) SPAM_TRACKER[nameKey] = [];
            SPAM_TRACKER[nameKey].push({ time: now });
            SPAM_TRACKER[nameKey] = SPAM_TRACKER[nameKey].filter(function(r) { return now - r.time < SPAM_WINDOW_MS; });
        }

        // ===== 管理员密码 =====
        var ADMIN_PASSWORD = 'hmj1314520';
        var isAdmin = localStorage.getItem('msgboard_admin') === '1';

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 高亮搜索关键词
        function highlightKeyword(text, keyword) {
            var escaped = escapeHtml(text);
            if (!keyword) return escaped;
            var safeKey = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var re = new RegExp('(' + safeKey + ')', 'gi');
            return escaped.replace(re, '<mark>$1</mark>');
        }

        // 获取过滤后的留言列表
        function getFilteredMessages() {
            if (!searchKeyword) return lastMessages;
            var kw = searchKeyword.toLowerCase();
            return lastMessages.filter(function(m) {
                return (m.name && m.name.toLowerCase().indexOf(kw) !== -1) ||
                       (m.content && m.content.toLowerCase().indexOf(kw) !== -1);
            });
        }

        function formatTime(ts) {
            var d = new Date(ts);
            var y = d.getFullYear();
            var mo = String(d.getMonth()+1).padStart(2,'0');
            var da = String(d.getDate()).padStart(2,'0');
            var h = String(d.getHours()).padStart(2,'0');
            var m = String(d.getMinutes()).padStart(2,'0');
            return y + '-' + mo + '-' + da + ' ' + h + ':' + m;
        }

        function decodeContent(b64) {
            try { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }
            catch(e) { return null; }
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 24px;border-radius:20px;font-size:0.9rem;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';
            toast.textContent = msg;
            document.body.appendChild(toast);
            requestAnimationFrame(function() { toast.style.opacity = '1'; });
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
            }, 2000);
        }

        function fetchWithTimeout(url, options, timeout) {
            timeout = timeout || 12000;
            return Promise.race([
                fetch(url, options),
                new Promise(function(_, reject) {
                    setTimeout(function() { reject(new Error('timeout')); }, timeout);
                })
            ]);
        }

        function updateAdminUI() {
            var badge = document.getElementById('adminBadge');
            var logoutBtn = document.getElementById('adminLogoutBtn');
            var batchBar = document.getElementById('adminBatchBar');

                badge.style.display = 'inline-block';

                batchBar.classList.add('show');

                badge.style.display = 'none';
                logoutBtn.style.display = 'none';
                batchBar.classList.remove('show');
                footerText.style.display = 'block';
                if (searchBar) searchBar.classList.remove('show');
                selectedIndices.clear();
                searchKeyword = '';
                var searchInput = document.getElementById('adminSearchInput');
                if (searchInput) searchInput.value = '';
            }

        function updateBatchUI() {
            var countEl = document.getElementById('batchCount');
            var deleteBtn = document.getElementById('batchDeleteBtn');
            var selectAllCb = document.getElementById('selectAllCheckbox');
            countEl.textContent = '已选 ' + selectedIndices.size + ' 条';
            deleteBtn.disabled = selectedIndices.size === 0;
            // 更新全选状态
            var total = lastMessages.length;
            selectAllCb.checked = total > 0 && selectedIndices.size === total;
            // 更新每条留言的选中样式
            var items = document.querySelectorAll('.message-item');
            items.forEach(function(item) {
                var idx = parseInt(item.getAttribute('data-idx'));
                var cb = item.querySelector('.msg-checkbox');

                    cb.checked = selectedIndices.has(idx);
                    if (selectedIndices.has(idx)) {

        function renderMessages(msgs) {
            var boardList = document.getElementById('boardList');
            var msgCount = document.getElementById('msgCount');

            // 管理员搜索过滤
            var displayMsgs = msgs;
            if (isAdmin && searchKeyword) {
                var kw = searchKeyword.toLowerCase();
                displayMsgs = msgs.filter(function(m) {
                    return (m.name && m.name.toLowerCase().indexOf(kw) !== -1) ||
                           (m.content && m.content.toLowerCase().indexOf(kw) !== -1);
                });
            }
            // 置顶留言排到最前（各自翻转：最新的在前）
            var pinned = [];
            var normal = [];
            displayMsgs.forEach(function(m) {
                if (m.pinned) pinned.push(m);
                else normal.push(m);
            });
            pinned.reverse();
            normal.reverse();
            displayMsgs = pinned.concat(normal);

            if (!displayMsgs || displayMsgs.length === 0) {
                if (isAdmin && searchKeyword) {
                    boardList.innerHTML = '<div class="message-empty">没有匹配「' + escapeHtml(searchKeyword) + '」的留言</div>';
                } else {
                    boardList.innerHTML = '<div class="message-empty">还没有留言，快来抢沙发吧！🛋</div>';
                }
                msgCount.textContent = '';
                updateBatchUI();
                return;
            }

            if (isAdmin && searchKeyword) {
                msgCount.textContent = '搜索 "' + searchKeyword + '" 找到 ' + displayMsgs.length + ' 条（共 ' + msgs.length + ' 条）';
            } else {
                msgCount.textContent = '共 ' + displayMsgs.length + ' 条留言';
            }

            var html = displayMsgs.map(function(m, idx) {
                var realIdx = lastMessages.indexOf(m);
                if (realIdx === -1) realIdx = displayMsgs.length - 1 - idx;
                var checkbox = '';
                var adminActions = '';
                if (isAdmin) {
                    checkbox = '<input type="checkbox" class="msg-checkbox" data-idx="' + realIdx + '" ' + (selectedIndices.has(realIdx) ? 'checked' : '') + '>';
                    var pinBtn = m.pinned ?
                        '<button class="msg-pin-btn unpin" onclick="togglePinMessage(' + realIdx + ')">📌 取消置顶</button>' :
                        '<button class="msg-pin-btn" onclick="togglePinMessage(' + realIdx + ')">📌 置顶</button>';
                    adminActions = '<div class="msg-admin-actions">' +
                        pinBtn +
                        '<button class="msg-delete-btn" onclick="deleteMessage(' + realIdx + ')">🗑 删除</button>' +
                    '</div>';
                }
                var pinnedClass = m.pinned ? ' pinned' : '';
                var pinnedBadge = m.pinned ? '<span class="msg-pinned-badge">📌 置顶</span>' : '';
                var selClass = selectedIndices.has(realIdx) ? ' selected' : '';
                var nameHtml = isAdmin && searchKeyword ? highlightKeyword(m.name, searchKeyword) : escapeHtml(m.name);
                var contentHtml = isAdmin && searchKeyword ? highlightKeyword(m.content, searchKeyword) : escapeHtml(m.content);
                // 回复按钮
                var replyBtn = '<div class="msg-actions"><button class="msg-reply-btn" onclick="toggleReply(' + realIdx + ')">💬 回复</button></div>';
                // 回复输入区
                var replyArea = '<div class="msg-reply-area" id="replyArea_' + realIdx + '">' +
                    '<input type="text" id="replyName_' + realIdx + '" placeholder="你的昵称（可选）" maxlength="20">' +
                    '<input type="text" id="replyContent_' + realIdx + '" placeholder="写下你的回复..." maxlength="500">' +
                    '<button class="msg-reply-submit" id="replyBtn_' + realIdx + '" onclick="submitReply(' + realIdx + ')">回复 ✈</button>' +
                '</div>';
                // 回复列表
                var repliesHtml = '';
                if (m.replies && m.replies.length > 0) {
                    repliesHtml = '<div class="msg-replies">' + m.replies.map(function(r, ri) {
                        var rNameHtml = isAdmin && searchKeyword ? highlightKeyword(r.name, searchKeyword) : escapeHtml(r.name);
                        var rContentHtml = isAdmin && searchKeyword ? highlightKeyword(r.content, searchKeyword) : escapeHtml(r.content);
                        var replyDelBtn = isAdmin ? '<button class="msg-reply-delete" onclick="deleteReply(' + realIdx + ',' + ri + ')">🗑</button>' : '';
                        return '<div class="msg-reply-item">' +
                            '<div class="msg-reply-header">' +
                                '<span class="msg-reply-name">' + rNameHtml + '</span>' +
                                '<span style="display:flex;align-items:center;gap:6px;">' +
                                    '<span class="msg-reply-time">' + formatTime(r.time) + '</span>' +
                                    replyDelBtn +
                                '</span>' +
                            '</div>' +
                            '<div class="msg-reply-content">' + rContentHtml + '</div>' +
                        '</div>';
                    }).join('') + '</div>';
                }
                return '<div class="message-item' + selClass + pinnedClass + '" data-idx="' + realIdx + '">' +
                    checkbox +
                    '<div class="msg-body">' +
                        '<div class="msg-header">' +
                            '<span class="msg-name">' + nameHtml + '</span>' +
                            '<span class="msg-time">' + formatTime(m.time) + '</span>' + pinnedBadge +
                        '</div>' +
                        '<div class="msg-content">' + contentHtml + '</div>' +
                        repliesHtml +
                        replyBtn +
                        replyArea +
                        adminActions +
                    '</div>' +
                '</div>';
            }).join('');

            boardList.innerHTML = html;

            // 给勾选框绑定事件
            if (isAdmin) {
                var checkboxes = document.querySelectorAll('.msg-checkbox');
                checkboxes.forEach(function(cb) {
                    cb.addEventListener('change', function() {
                        var idx = parseInt(this.getAttribute('data-idx'));
                        if (this.checked) {
                            selectedIndices.add(idx);
                        } else {
                            selectedIndices.delete(idx);
                        }
                        updateBatchUI();
                    });
                });
            }

            updateBatchUI();
        }

        // ===== 读取留言 =====
        async function fetchFromCDN() {
            try {
                var resp = await fetchWithTimeout(CDN_URL + '?t=' + Date.now(), {}, 8000);
                if (!resp.ok) return null;
                var data = await resp.json();
                return data.messages || [];
            } catch(e) { return null; }
        }

        async function fetchFromRaw() {
            try {
                var resp = await fetchWithTimeout(RAW_URL + '?t=' + Date.now(), {}, 12000);
                if (!resp.ok) return null;
                var data = await resp.json();
                return data.messages || [];
            } catch(e) { return null; }
        }

        async function fetchFromAPI() {
            try {
                var resp = await fetchWithTimeout(API_URL + '?t=' + Date.now(), {
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github+json'
                    }
                }, 12000);
                if (!resp.ok) return null;
                var data = await resp.json();
                var sha = data.sha;
                var msgs = [];
                if (data.content) {
                    var decoded = decodeContent(data.content);
                    if (decoded) {
                        try { msgs = JSON.parse(decoded).messages || []; } catch(e) {}
                    }
                }
                return { sha: sha, messages: msgs };
            } catch(e) { return null; }
        }

        async function fetchMessages() {
            // 如果有回复输入框打开或有输入框获得焦点，跳过本次刷新避免键盘收回
            var activeReply = document.querySelector('.msg-reply-area.show');
            var focusedTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeReply || (focusedTag === 'INPUT' && document.activeElement && document.activeElement.id !== 'boardName')) {
                // 仅静默更新数据，不重新渲染
                var apiData = await fetchFromAPI();
                if (apiData) {
                    lastSha = apiData.sha;
                    lastMessages = apiData.messages || [];
                }
                return lastMessages;
            }

            var apiData = await fetchFromAPI();
            if (apiData) {
                lastSha = apiData.sha;
                lastMessages = apiData.messages || [];
                // 清理无效的选中项
                var validSet = new Set();
                selectedIndices.forEach(function(idx) {
                    if (idx >= 0 && idx < lastMessages.length) validSet.add(idx);
                });
                selectedIndices = validSet;
                renderMessages(lastMessages);
                return lastMessages;
            }

            var cdnMsgs = await fetchFromCDN();
            if (cdnMsgs) {
                lastMessages = cdnMsgs;
                renderMessages(cdnMsgs);
                return lastMessages;
            }

            var rawMsgs = await fetchFromRaw();
            if (rawMsgs) {
                lastMessages = rawMsgs;
                renderMessages(rawMsgs);
                return lastMessages;
            }

            renderMessages([]);
            return [];
        }

        var lastSha = null;

        // ===== 发布留言 =====
        async function addMessage(name, content, btnEl) {
            if (!content.trim()) { showToast('请输入留言内容！'); return false; }
            if (isPublishing) { showToast('正在发布中，请稍等...'); return false; }

            // 防刷屏检查
            var spamMsg = checkSpam(name, content, false);
            if (spamMsg) { showToast(spamMsg); return false; }

            isPublishing = true;
            if (btnEl) { btnEl.textContent = '发布中...'; btnEl.disabled = true; }

            var newMsg = { name: name.trim() || '匿名访客', content: content.trim(), time: Date.now() };

            try {
                var msgs = lastMessages.slice();
                msgs.push(newMsg);
                if (msgs.length > MAX_MSGS) msgs = msgs.slice(msgs.length - MAX_MSGS);

                lastMessages = msgs;
                renderMessages(msgs);

                var contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: msgs}))));
                var putBody = { message: 'Update messages', content: contentB64 };
                if (lastSha) putBody.sha = lastSha;

                var putResp = await fetchWithTimeout(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                }, 15000);

                if (putResp && putResp.ok) {
                    var putData = await putResp.json();
                    if (putData.content && putData.content.sha) lastSha = putData.content.sha;
                    try { fetch(PURGE_URL); } catch(e) {}
                    showToast('发布成功！✅');
                    recordSpam(name, content);
                } else if (putResp && putResp.status === 409) {
                    showToast('同步数据中...');
                    var apiData = await fetchFromAPI();
                    if (apiData) {
                        lastSha = apiData.sha;
                        var freshMsgs = apiData.messages;
                        freshMsgs.push(newMsg);
                        if (freshMsgs.length > MAX_MSGS) freshMsgs = freshMsgs.slice(freshMsgs.length - MAX_MSGS);
                        var retryB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: freshMsgs}))));
                        var retryBody = { message: 'Update messages', content: retryB64, sha: lastSha };
                        var retryResp = await fetchWithTimeout(API_URL, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'token ' + GH_TOKEN,
                                'Accept': 'application/vnd.github+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(retryBody)
                        }, 15000);
                        if (retryResp && retryResp.ok) {
                            var retryData = await retryResp.json();
                            if (retryData.content && retryData.content.sha) lastSha = retryData.content.sha;
                            try { fetch(PURGE_URL); } catch(e) {}
                            showToast('发布成功！✅');
                            recordSpam(name, content);
                            lastMessages = freshMsgs;
                            renderMessages(freshMsgs);
                        } else {
                            showToast('发布失败，请重试 ❌');
                        }
                    } else {
                        showToast('网络错误，请重试 ❌');
                    }
                } else {
                    showToast('发布失败，请重试 ❌');
                    var fresh = await fetchFromAPI();
                    if (fresh) { lastMessages = fresh.messages; lastSha = fresh.sha; renderMessages(fresh.messages); }
                }
            } catch(e) {
                showToast('网络错误，请重试 ❌');
                var fresh2 = await fetchFromAPI();
                if (fresh2) { lastMessages = fresh2.messages; lastSha = fresh2.sha; renderMessages(fresh2.messages); }
            }

            isPublishing = false;
            if (btnEl) { btnEl.textContent = '发布留言 ✈'; btnEl.disabled = false; }
            return true;
        }

        // ===== 回复功能 =====
        function toggleReply(msgIndex) {
            var area = document.getElementById('replyArea_' + msgIndex);
            if (!area) return;
            if (area.classList.contains('show')) {
                area.classList.remove('show');
            } else {
                area.classList.add('show');
                var contentInput = document.getElementById('replyContent_' + msgIndex);
                if (contentInput) contentInput.focus();
            }
        }
        window.toggleReply = toggleReply;

        async function submitReply(msgIndex) {
            var nameEl = document.getElementById('replyName_' + msgIndex);
            var contentEl = document.getElementById('replyContent_' + msgIndex);
            var btnEl = document.getElementById('replyBtn_' + msgIndex);
            if (!contentEl || !contentEl.value.trim()) { showToast('请输入回复内容！'); return; }
            if (isPublishing) { showToast('操作中，请稍等...'); return; }

            var replyName = nameEl ? (nameEl.value.trim() || '匿名访客') : '匿名访客';
            var replyContent = contentEl.value.trim();

            // 防刷屏检查
            var spamMsg = checkSpam(replyName, replyContent, true);
            if (spamMsg) { showToast(spamMsg); return; }

            isPublishing = true;
            if (btnEl) { btnEl.textContent = '回复中...'; btnEl.disabled = true; }

            var newReply = { name: replyName, content: replyContent, time: Date.now() };

            try {
                var apiData = await fetchFromAPI();
                if (!apiData) { showToast('获取数据失败 ❌'); isPublishing = false; if (btnEl) { btnEl.textContent = '回复 ✈'; btnEl.disabled = false; } return; }

                var msgs = apiData.messages;
                lastSha = apiData.sha;
                lastMessages = msgs;

                if (msgIndex < 0 || msgIndex >= msgs.length) {
                    showToast('留言不存在 ❌'); isPublishing = false; if (btnEl) { btnEl.textContent = '回复 ✈'; btnEl.disabled = false; } return;
                }

                if (!msgs[msgIndex].replies) msgs[msgIndex].replies = [];
                msgs[msgIndex].replies.push(newReply);
                if (msgs[msgIndex].replies.length > 50) msgs[msgIndex].replies = msgs[msgIndex].replies.slice(-50);

                lastMessages = msgs;
                renderMessages(msgs);

                var contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: msgs}))));
                var putBody = { message: 'Add reply', content: contentB64, sha: lastSha };

                var putResp = await fetchWithTimeout(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                }, 15000);

                if (putResp && putResp.ok) {
                    var putData = await putResp.json();
                    if (putData.content && putData.content.sha) lastSha = putData.content.sha;
                    try { fetch(PURGE_URL); } catch(e) {}
                    showToast('回复成功！✅');
                    recordSpam(replyName, replyContent);
                } else if (putResp && putResp.status === 409) {
                    showToast('同步数据中...');
                    var retryData = await fetchFromAPI();
                    if (retryData) {
                        lastSha = retryData.sha;
                        var freshMsgs = retryData.messages;
                        if (msgIndex >= 0 && msgIndex < freshMsgs.length) {
                            if (!freshMsgs[msgIndex].replies) freshMsgs[msgIndex].replies = [];
                            freshMsgs[msgIndex].replies.push(newReply);
                            if (freshMsgs[msgIndex].replies.length > 50) freshMsgs[msgIndex].replies = freshMsgs[msgIndex].replies.slice(-50);
                        }
                        var retryB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: freshMsgs}))));
                        var retryResp = await fetchWithTimeout(API_URL, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'token ' + GH_TOKEN,
                                'Accept': 'application/vnd.github+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: 'Add reply', content: retryB64, sha: lastSha })
                        }, 15000);
                        if (retryResp && retryResp.ok) {
                            var rData = await retryResp.json();
                            if (rData.content && rData.content.sha) lastSha = rData.content.sha;
                            try { fetch(PURGE_URL); } catch(e) {}

                            lastMessages = freshMsgs;
                            renderMessages(freshMsgs);

                    } else {
                        showToast('网络错误 ❌');
                    }

                    showToast('回复失败，请重试 ❌');

            } catch(e) {

        }
        window.submitReply = submitReply;

        // ===== 删除回复 =====
        async function deleteReply(msgIndex, replyIndex) {
            if (!isAdmin) { showToast('无权限'); return; }
            if (isPublishing) { showToast('操作中，请稍等...'); return; }
            if (!confirm('确定删除这条回复吗？')) return;

            isPublishing = true;

                var apiData = await fetchFromAPI();
                if (!apiData) { showToast('获取数据失败 ❌'); isPublishing = false; return; }

                var msgs = apiData.messages;
                lastSha = apiData.sha;
                lastMessages = msgs;

                if (msgIndex < 0 || msgIndex >= msgs.length) {
                    showToast('留言不存在 ❌'); isPublishing = false; return;
                }
                if (!msgs[msgIndex].replies || replyIndex < 0 || replyIndex >= msgs[msgIndex].replies.length) {
                    showToast('回复不存在 ❌'); isPublishing = false; return;
                }

                msgs[msgIndex].replies.splice(replyIndex, 1);
                if (msgs[msgIndex].replies.length === 0) delete msgs[msgIndex].replies;

                lastMessages = msgs;
                renderMessages(msgs);

                var contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: msgs}))));
                var putBody = { message: 'Delete a reply', content: contentB64, sha: lastSha };

                var putResp = await fetchWithTimeout(API_URL, {
                    method: 'PUT',
                    headers: {

                    },
                    body: JSON.stringify(putBody)
                }, 15000);

                if (putResp && putResp.ok) {
                    var putData = await putResp.json();
                    if (putData.content && putData.content.sha) lastSha = putData.content.sha;
                    try { fetch(PURGE_URL); } catch(e) {}
                    showToast('删除回复成功！✅');
                } else if (putResp && putResp.status === 409) {
                    var retryData = await fetchFromAPI();
                    if (retryData) {
                        lastSha = retryData.sha;
                        var freshMsgs = retryData.messages;
                        if (msgIndex >= 0 && msgIndex < freshMsgs.length && freshMsgs[msgIndex].replies) {
                            if (replyIndex < freshMsgs[msgIndex].replies.length) {
                                freshMsgs[msgIndex].replies.splice(replyIndex, 1);
                                if (freshMsgs[msgIndex].replies.length === 0) delete freshMsgs[msgIndex].replies;
                            }
                        }
                        var retryB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: freshMsgs}))));
                        var retryResp = await fetchWithTimeout(API_URL, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'token ' + GH_TOKEN,
                                'Accept': 'application/vnd.github+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: 'Delete a reply', content: retryB64, sha: lastSha })
                        }, 15000);
                        if (retryResp && retryResp.ok) {
                            var rData = await retryResp.json();
                            if (rData.content && rData.content.sha) lastSha = rData.content.sha;
                            try { fetch(PURGE_URL); } catch(e) {}
                            showToast('删除回复成功！✅');
                            lastMessages = freshMsgs;
                            renderMessages(freshMsgs);
                        } else {
                            showToast('删除失败，请重试 ❌');
                            lastMessages = retryData.messages;
                            renderMessages(retryData.messages);
                        }
                    } else {
                        showToast('网络错误 ❌');
                    }
                } else {
                    showToast('删除失败，请重试 ❌');
                    lastMessages = apiData.messages;
                    renderMessages(apiData.messages);
                }
            } catch(e) {
                showToast('网络错误 ❌');
            }
            isPublishing = false;
        }
        window.deleteReply = deleteReply;

        // ===== 批量删除留言 =====
        async function deleteBatchMessages() {
            if (!isAdmin) { showToast('无权限'); return; }
            if (isPublishing) { showToast('操作中，请稍等...'); return; }
            if (selectedIndices.size === 0) { showToast('请先选择要删除的留言'); return; }
            if (!confirm('确定删除选中的 ' + selectedIndices.size + ' 条留言吗？')) return;

            isPublishing = true;
            var batchDeleteBtn = document.getElementById('batchDeleteBtn');
            batchDeleteBtn.textContent = '删除中...';
            batchDeleteBtn.disabled = true;

            try {
                var apiData = await fetchFromAPI();
                if (!apiData) { showToast('获取数据失败，请重试 ❌'); isPublishing = false; batchDeleteBtn.textContent = '🗑 批量删除'; batchDeleteBtn.disabled = false; return; }

                var msgs = apiData.messages;
                lastSha = apiData.sha;

                // 从大到小排序选中的索引，从后往前删，避免索引错位
                var toDelete = Array.from(selectedIndices).sort(function(a, b) { return b - a; });
                for (var i = 0; i < toDelete.length; i++) {
                    if (toDelete[i] >= 0 && toDelete[i] < msgs.length) {
                        msgs.splice(toDelete[i], 1);
                    }
                }

                lastMessages = msgs;
                selectedIndices.clear();
                renderMessages(msgs);

                var contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: msgs}))));
                var putBody = { message: 'Batch delete messages', content: contentB64, sha: lastSha };

                var putResp = await fetchWithTimeout(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                }, 15000);

                if (putResp && putResp.ok) {
                    var putData = await putResp.json();
                    if (putData.content && putData.content.sha) lastSha = putData.content.sha;
                    try { fetch(PURGE_URL); } catch(e) {}
                    showToast('批量删除成功！✅');
                } else if (putResp && putResp.status === 409) {
                    // SHA冲突，重新获取再删
                    var retryData = await fetchFromAPI();
                    if (retryData) {
                        lastSha = retryData.sha;
                        var freshMsgs = retryData.messages;
                        // 重新删一遍
                        var toDelete2 = Array.from(selectedIndices).sort(function(a, b) { return b - a; });
                        for (var j = 0; j < toDelete2.length; j++) {
                            if (toDelete2[j] >= 0 && toDelete2[j] < freshMsgs.length) {
                                freshMsgs.splice(toDelete2[j], 1);
                            }
                        }
                        var retryB64 = btoa(unescape(encodeURIComponent(JSON.stringify({messages: freshMsgs}))));
                        var retryResp = await fetchWithTimeout(API_URL, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'token ' + GH_TOKEN,
                                'Accept': 'application/vnd.github+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: 'Batch delete messages', content: retryB64, sha: lastSha })
                        }, 15000);
                        if (retryResp && retryResp.ok) {
                            var rData = await retryResp.json();
                            if (rData.content && rData.content.sha) lastSha = rData.content.sha;
                            try { fetch(PURGE_URL); } catch(e) {}
                            showToast('批量删除成功！✅');
                            lastMessages = freshMsgs;
                            selectedIndices.clear();
                            renderMessages(freshMsgs);
                        } else {
                            showToast('删除失败，请重试 ❌');
                            lastMessages = retryData.messages;
                            selectedIndices.clear();
                            renderMessages(retryData.messages);
                        }
                    } else {
                        showToast('网络错误 ❌');
                    }
                } else {
                    showToast('删除失败，请重试 ❌');
                    lastMessages = apiData.messages;
                    selectedIndices.clear();
                    renderMessages(apiData.messages);
                }
            } catch(e) {
                showToast('网络错误 ❌');
            }

            isPublishing = false;
            batchDeleteBtn.textContent = '🗑 批量删除';
            batchDeleteBtn.disabled = false;
        }

        // ===== 管理员登录/退出 =====
        function adminLogin() {
            var input = document.getElementById('adminPwdInput');
            var pwd = input.value.trim();
            if (!pwd) { document.getElementById('adminError').style.display = 'block'; return; }

            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('msgboard_admin', '1');
                updateAdminUI();
                document.getElementById('adminModal').classList.remove('show');
                input.value = '';
                document.getElementById('adminError').style.display = 'none';
                showToast('管理员登录成功 ✅');
                renderMessages(lastMessages);
            } else {
                document.getElementById('adminError').style.display = 'block';
                input.value = '';
            }
        }

        function adminLogout() {
            isAdmin = false;
            localStorage.removeItem('msgboard_admin');
            selectedIndices.clear();
            updateAdminUI();
            showToast('已退出管理员模式');
            renderMessages(lastMessages);
        }

        document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);
        document.getElementById('adminPwdInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') adminLogin();
        });
        document.getElementById('adminLogoutBtn').addEventListener('click', adminLogout);
        document.getElementById('adminCloseBtn').addEventListener('click', function() {
            document.getElementById('adminModal').classList.remove('show');
            document.getElementById('adminPwdInput').value = '';
            document.getElementById('adminError').style.display = 'none';
        });

        // ===== 底部栏连点5次激活管理员登录 =====
        var footerClickCount = 0;
        var footerClickTimer = null;
        document.getElementById('footerText').addEventListener('click', function() {
            footerClickCount++;
            if (footerClickTimer) clearTimeout(footerClickTimer);
            footerClickTimer = setTimeout(function() { footerClickCount = 0; }, 2000);
            if (footerClickCount >= 5) {
                footerClickCount = 0;
                document.getElementById('adminModal').classList.add('show');
                document.getElementById('adminPwdInput').focus();
            }
        });

        // ===== 全选/取消全选 =====
        document.getElementById('selectAllCheckbox').addEventListener('change', function() {
            if (this.checked) {
                for (var i = 0; i < lastMessages.length; i++) {
                    selectedIndices.add(i);
                }
            } else {
                selectedIndices.clear();
            }
            renderMessages(lastMessages);
        });

        // ===== 批量删除按钮 =====
        document.getElementById('batchDeleteBtn').addEventListener('click', deleteBatchMessages);

        // ===== 取消选择按钮 =====
        document.getElementById('batchCancelBtn').addEventListener('click', function() {
            selectedIndices.clear();
            renderMessages(lastMessages);
        });

        // ===== 管理员搜索 =====
        var adminSearchInput = document.getElementById('adminSearchInput');
        var adminSearchClear = document.getElementById('adminSearchClear');
        var searchDebounceTimer = null;
        adminSearchInput.addEventListener('input', function() {
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(function() {
                searchKeyword = adminSearchInput.value.trim();
                renderMessages(lastMessages);
            }, 200);
        });
        adminSearchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                searchKeyword = adminSearchInput.value.trim();
                renderMessages(lastMessages);
            }
        });
        adminSearchClear.addEventListener('click', function() {
            adminSearchInput.value = '';
            searchKeyword = '';
            renderMessages(lastMessages);
            adminSearchInput.focus();
        });

        // ===== 留言板提交 =====
        document.getElementById('boardSubmit').addEventListener('click', function() {
            var name = document.getElementById('boardName').value;
            var msg = document.getElementById('boardMsg').value;
            addMessage(name, msg, this);
        });

        document.getElementById('boardMsg').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                document.getElementById('boardSubmit').click();
            }
        });

        // ===== 回到顶部按钮 =====
        var backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ===== 初始化 =====
        updateAdminUI();
        fetchMessages();

        // ===== 自动刷新 =====
        setInterval(fetchMessages, 5000);
    </script>
