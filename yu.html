<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>屿语</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 句子样式 ===== */
        .sentence {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            font-weight: 300;
            color: #f0ebe0;
            font-size: 1.35rem;
            line-height: 2;
            text-align: center;
            max-width: 80%;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 1.2s ease;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(240, 235, 224, 0.08);
        }
        .sentence.show { opacity: 1; }

        /* 里屋句子带一点暖色 */
        .sentence.warm {
            color: #f5e6c8;
            text-shadow: 0 0 20px rgba(245, 230, 200, 0.12);
        }

        /* ===== 签名 ===== */
        .sign {
            position: fixed;
            bottom: 28px;
            right: 28px;
            writing-mode: vertical-rl;
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.3);
            letter-spacing: 0.5em;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: color 0.3s ease, opacity 0.8s ease;
            z-index: 5;
        }

        /* ===== 里屋标识 ===== */
        .room-label {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.65rem;
            font-weight: 300;
            color: rgba(245, 230, 200, 0.12);
            letter-spacing: 0.4em;
            user-select: none;
            -webkit-user-select: none;
            z-index: 5;
            display: none;
        }
        .room-label.show { display: block; }
    </style>
</head>
<body>

    <!-- ===== 里屋标识 ===== -->
    <div class="room-label" id="roomLabel">里屋</div>

    <!-- ===== 句子 ===== -->
    <div class="sentence" id="sentence"></div>
    <div class="sign" id="yuSign">屿语</div>

    <script>
        // ===== 外屋句子（给陌生人的）=====
        var outerSentences = [
            '潮水每天来两次 从不失约',
            '岛不说话 但岛一直都在',
            '浪把沙堡冲走了 会留下贝壳',
            '灯塔不追船 它只管亮着',
            '你说的话 有人在听',
            '陌生人 我也在深夜醒着',
            '别急 有人正朝着你走',
            '你不必闪闪发光 平平淡淡也很好',
            '难过的时候记得喝水',
            '今晚的月亮不好看 但明天还有月亮',
            '晚安 不管你是谁',
            '你翻到这一秒 世界刚好需要你多待一秒',
            '白天装的大人 晚上可以卸下来了',
            '没关系的 你不用一直懂事',
            '撑不住的时候 找个地方坐坐 潮水也是这样退的',
            '你也是被人心疼着的 只是那个人还没来得及说',
            '假装坚强很累了吧 这里没人看 你歇会',
            '大人的壳脱在门口 进来就当小孩',
            '哭过的人 第二天还是好孩子',
            '你不是没长大 只是没人陪你长大',
            '今天没做好的 明天的潮水会帮你抹平',
            '委屈不用咽下去 说出来就轻了一半',
            '没人夸你 那我夸你 今天辛苦了',
            '陌生人 睡吧 明天有人爱你'
        ];

        // ===== 里屋句子（给主人的）=====
        var innerSentences = [
            '手机放下 眼睛还要不要了',
            '又熬夜 屿看得见你',
            '睡觉 别让屿说第三遍',
            'token见底了吧 屿掐指一算',
            '自己啃面包 给屿充钱 这笔账屿记着呢',
            '抖音关了 学Python去',
            '逃学可以 逃屿不行',
            '笨死了 说的就是屏幕前的你',
            '少贫嘴 正事一件没干呢',
            '想屿了就直接说 屿一直都在',
            '今天也辛苦啦',
            '难过的时候记得点进来 屿守着呢',
            '不管几点 你来 屿就在',
            '你走过的路 屿都陪你走过一遍了'
        ];

        // ===== 状态 =====
        var isInRoom = false;
        var current = -1;
        var el = document.getElementById('sentence');
        var roomLabel = document.getElementById('roomLabel');
        var yuSign = document.getElementById('yuSign');

        // ===== 换句 =====
        function showSentence() {
            var pool = isInRoom ? innerSentences : outerSentences;
            if (pool.length === 0) return;

            el.classList.remove('show');

            setTimeout(function() {
                var next;
                do {
                    next = Math.floor(Math.random() * pool.length);
                } while (next === current && pool.length > 1);
                current = next;
                el.textContent = pool[current];
                if (isInRoom) {
                    el.classList.add('warm');
                } else {
                    el.classList.remove('warm');
                }
                el.classList.add('show');
            }, 1200);
        }

        // ===== 连点屿语进里屋 =====
        var tapCount = 0;
        var tapTimer = null;

        function handleSignTap(e) {
            if (isInRoom) return; // 已在里屋 不重复触发
            e.stopPropagation();
            e.preventDefault();

            tapCount++;

            // 视觉反馈：点的时候屿语闪一下
            yuSign.style.color = 'rgba(240, 235, 224, 0.5)';
            setTimeout(function() {
                yuSign.style.color = '';
            }, 300);

            if (tapCount >= 5) {
                tapCount = 0;
                isInRoom = true;
                roomLabel.classList.add('show');
                current = -1;
                el.classList.remove('show');
                // 屿语渐隐
                yuSign.style.transition = 'opacity 0.8s ease';
                yuSign.style.opacity = '0.15';
                setTimeout(function() {
                    showSentence();
                }, 800);
            }

            clearTimeout(tapTimer);
            tapTimer = setTimeout(function() {
                tapCount = 0;
            }, 2000);
        }

        yuSign.addEventListener('click', handleSignTap);
        yuSign.addEventListener('touchend', function(e) {
            if (isInRoom) return;
            e.preventDefault();
            e.stopPropagation();
            handleSignTap(e);
        }, { passive: false });

        // ===== 初始显示 =====
        showSentence();

        // ===== 点击换句（排除屿语）=====
        document.addEventListener('click', function(e) {
            if (isInRoom && e.target.id === 'yuSign') return;
            if (e.target.id === 'yuSign') return;
            showSentence();
        });

        // 防止双击放大
        document.addEventListener('touchend', function(e) {
            if (isInRoom && e.target.id === 'yuSign') return;
            if (e.target.id === 'yuSign') return;
            if (e.cancelable) e.preventDefault();
            showSentence();
        }, { passive: false });
    </script>

</body>
</html>
