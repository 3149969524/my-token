<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>屿语</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 句子样式 ===== */
        .sentence {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            font-weight: 300;
            color: #f0ebe0;
            font-size: 1.35rem;
            line-height: 2;
            text-align: center;
            max-width: 80%;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 1.2s ease;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(240, 235, 224, 0.08);
        }
        .sentence.show { opacity: 1; }

        /* 里屋句子带一点暖色 */
        .sentence.warm {
            color: #f5e6c8;
            text-shadow: 0 0 20px rgba(245, 230, 200, 0.12);
        }

        /* ===== 签名 ===== */
        .sign {
            position: fixed;
            bottom: 28px;
            right: 28px;
            writing-mode: vertical-rl;
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.3);
            letter-spacing: 0.5em;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: color 0.3s ease, opacity 0.8s ease;
            z-index: 5;
        }

        /* ===== 里屋门 ===== */
        .inner-door {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .inner-door.hide {
            opacity: 0;
            pointer-events: none;
        }
        .door-title {
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 1.4rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.7);
            letter-spacing: 0.3em;
            margin-bottom: 36px;
            text-shadow: 0 0 20px rgba(240, 235, 224, 0.08);
        }
        .door-input {
            width: 220px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f0ebe0;
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            text-align: center;
            letter-spacing: 0.1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .door-input:focus {
            border-color: rgba(240, 235, 224, 0.35);
        }
        .door-input::placeholder {
            color: rgba(240, 235, 224, 0.18);
            font-weight: 300;
        }
        .door-btn {
            margin-top: 18px;
            padding: 8px 36px;
            background: transparent;
            border: 1px solid rgba(240, 235, 224, 0.2);
            border-radius: 50px;
            color: rgba(240, 235, 224, 0.6);
            font-size: 0.85rem;
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .door-btn:hover {
            background: rgba(240, 235, 224, 0.06);
            border-color: rgba(240, 235, 224, 0.4);
            color: #f0ebe0;
        }
        .door-hint {
            margin-top: 14px;
            font-size: 0.68rem;
            color: rgba(240, 235, 224, 0.15);
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.1em;
        }
        .shake {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ===== 里屋标识 ===== */
        .room-label {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.65rem;
            font-weight: 300;
            color: rgba(245, 230, 200, 0.12);
            letter-spacing: 0.4em;
            user-select: none;
            -webkit-user-select: none;
            z-index: 5;
            display: none;
        }
        .room-label.show { display: block; }

        /* ===== 时间胶囊 ===== */
        .capsule-btn {
            position: fixed;
            bottom: 28px;
            left: 28px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            opacity: 0.25;
            transition: opacity 0.3s ease;
            z-index: 5;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-btn:hover { opacity: 0.5; }
        .capsule-btn svg {
            width: 100%;
            height: 100%;
        }

        .capsule-modal {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 9999;
            transition: opacity 0.6s ease;
            padding: 50px 20px 30px;
            overflow-y: auto;
        }
        .capsule-modal.show {
            display: flex;
        }
        .capsule-modal.hide {
            opacity: 0;
            pointer-events: none;
        }
        .capsule-icon-big {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .capsule-title {
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.7);
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }
        .capsule-date {
            font-size: 0.78rem;
            color: rgba(240, 235, 224, 0.3);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .capsule-countdown {
            font-size: 0.7rem;
            color: rgba(240, 235, 224, 0.2);
            letter-spacing: 0.08em;
        }
        .capsule-content {
            max-width: 85%;
            max-height: 55vh;
            overflow-y: auto;
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 1.08rem;
            font-weight: 300;
            line-height: 2.2;
            color: #f5e6c8;
            text-align: center;
            letter-spacing: 0.06em;
            white-space: pre-wrap;
            word-break: break-word;
            text-shadow: 0 0 20px rgba(245, 230, 200, 0.1);
            padding: 10px;
        }
        .capsule-content::-webkit-scrollbar { width: 2px; }
        .capsule-content::-webkit-scrollbar-thumb { background: rgba(240,235,224,0.1); }
        .capsule-close {
            position: fixed;
            top: 20px;
            right: 24px;
            font-size: 1.3rem;
            color: rgba(240, 235, 224, 0.3);
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10001;
        }
        .capsule-close:hover { color: rgba(240, 235, 224, 0.6); }
        .capsule-fadein {
            animation: capsuleFade 1.2s ease;
        }
        @keyframes capsuleFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 胶囊密码门 */
        .capsule-lock {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .capsule-input {
            width: 220px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f0ebe0;
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            text-align: center;
            letter-spacing: 0.1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-input:focus {
            border-color: rgba(240, 235, 224, 0.35);
        }
        .capsule-input::placeholder {
            color: rgba(240, 235, 224, 0.18);
            font-weight: 300;
        }
        .capsule-lock-btn {
            margin-top: 18px;
            padding: 8px 36px;
            background: transparent;
            border: 1px solid rgba(240, 235, 224, 0.2);
            border-radius: 50px;
            color: rgba(240, 235, 224, 0.6);
            font-size: 0.85rem;
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .capsule-lock-btn:hover {
            background: rgba(240, 235, 224, 0.06);
            border-color: rgba(240, 235, 224, 0.4);
            color: #f0ebe0;
        }
        .capsule-lock-hint {
            margin-top: 14px;
            font-size: 0.68rem;
            color: rgba(240, 235, 224, 0.15);
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.1em;
        }

        /* 胶囊列表 */
        .capsule-list {
            display: none;
            flex-direction: column;
            gap: 14px;
            max-width: 440px;
            width: 100%;
            max-height: 65vh;
            overflow-y: auto;
            padding: 10px 5px 80px;
        }
        .capsule-list.show { display: flex; }
        .capsule-list::-webkit-scrollbar { width: 2px; }
        .capsule-list::-webkit-scrollbar-thumb { background: rgba(240,235,224,0.1); }

        /* 搜索筛选区 */
        .capsule-search {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            gap: 10px;
            margin-bottom: 16px;
            padding: 0 5px;
        }
        .capsule-search.show { display: flex; }
        .capsule-search-name {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(240,235,224,0.12);
            border-radius: 10px;
            color: #f0ebe0;
            font-size: 0.88rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-search-name:focus {
            border-color: rgba(240,235,224,0.35);
        }
        .capsule-search-name::placeholder {
            color: rgba(240,235,224,0.2);
            font-weight: 300;
        }
        .capsule-search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .capsule-search-label {
            font-size: 0.78rem;
            color: rgba(240,235,224,0.35);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .capsule-search input[type="date"] {
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(240,235,224,0.12);
            border-radius: 8px;
            color: #f0ebe0;
            font-size: 0.85rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            color-scheme: dark;
            flex: 1;
            min-width: 0;
            transition: border-color 0.3s;
        }
        .capsule-search input[type="date"]:focus {
            border-color: rgba(240,235,224,0.35);
        }
        .capsule-search-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .capsule-search-btn {
            padding: 6px 18px;
            background: transparent;
            border: 1px solid rgba(240,235,224,0.15);
            border-radius: 50px;
            color: rgba(240,235,224,0.5);
            font-size: 0.78rem;
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-search-btn:hover {
            border-color: rgba(240,235,224,0.35);
            color: rgba(240,235,224,0.8);
            background: rgba(255,255,255,0.04);
        }
        .capsule-search-btn.active {
            border-color: rgba(245,230,200,0.4);
            color: rgba(245,230,200,0.8);
            background: rgba(245,230,200,0.06);
        }
        .capsule-search-count {
            font-size: 0.72rem;
            color: rgba(240,235,224,0.2);
            letter-spacing: 0.05em;
            padding: 0 2px;
        }

        .capsule-card {
            padding: 20px 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(240,235,224,0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-card:hover {
            border-color: rgba(240,235,224,0.3);
            background: rgba(255,255,255,0.05);
        }
        .capsule-card-title {
            font-size: 1.02rem;
            color: rgba(240,235,224,0.75);
            letter-spacing: 0.05em;
        }
        .capsule-card-date {
            font-size: 0.82rem;
            color: rgba(240,235,224,0.35);
            margin-top: 8px;
        }
        .capsule-card-status {
            font-size: 0.76rem;
            color: rgba(240,235,224,0.25);
            margin-top: 5px;
        }
        .capsule-detail {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .capsule-detail.show { display: flex; }
        .capsule-back {
            position: fixed;
            top: 20px;
            left: 24px;
            font-size: 0.8rem;
            color: rgba(240,235,224,0.3);
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10001;
        }
        .capsule-back:hover { color: rgba(240,235,224,0.6); }

        /* 写胶囊表单 */
        .capsule-write {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            gap: 16px;
        }
        .capsule-write.show { display: flex; }
        .capsule-write label {
            font-size: 0.82rem;
            color: rgba(240,235,224,0.4);
            letter-spacing: 0.1em;
            align-self: flex-start;
            margin-bottom: -8px;
        }
        .capsule-write input[type="datetime-local"],
        .capsule-write input[type="date"],
        .capsule-write input[type="text"],
        .capsule-write textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(240,235,224,0.12);
            border-radius: 12px;
            color: #f0ebe0;
            font-size: 0.98rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-write input[type="date"]:focus,
        .capsule-write input[type="text"]:focus,
        .capsule-write textarea:focus {
            border-color: rgba(240,235,224,0.35);
        }
        .capsule-write input::placeholder,
        .capsule-write textarea::placeholder {
            color: rgba(240,235,224,0.18);
            font-weight: 300;
        }
        .capsule-write textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.9;
        }
        .capsule-write input[type="date"],
        .capsule-write input[type="datetime-local"] {
            color-scheme: dark;
        }
        .capsule-write-btn {
            margin-top: 10px;
            padding: 12px 48px;
            background: transparent;
            border: 1px solid rgba(240,235,224,0.25);
            border-radius: 50px;
            color: rgba(240,235,224,0.7);
            font-size: 0.98rem;
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .capsule-write-btn:hover {
            background: rgba(240,235,224,0.06);
            border-color: rgba(240,235,224,0.45);
            color: #f0ebe0;
        }
        .capsule-write-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .capsule-write-new-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(240,235,224,0.2);
            border-radius: 14px;
            color: rgba(240,235,224,0.4);
            font-size: 0.92rem;
            font-family: 'Noto Sans SC', sans-serif;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-write-new-btn:hover {
            border-color: rgba(240,235,224,0.4);
            color: rgba(240,235,224,0.7);
            background: rgba(255,255,255,0.05);
        }
        .capsule-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: rgba(10,16,41,0.95);
            border: 1px solid rgba(240,235,224,0.2);
            border-radius: 16px;
            padding: 30px 40px;
            color: #f5e6c8;
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            text-align: center;
            z-index: 10002;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .capsule-toast.show { opacity: 1; }

        /* 固定底部写胶囊按钮 */
        .capsule-write-fab {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(7,11,30,0.85) 0%, rgba(7,11,30,0.98) 60%, rgba(7,11,30,1) 100%);
            border-top: 1px solid rgba(240,235,224,0.08);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10003;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .capsule-write-fab.show { display: flex; }
        .capsule-write-fab-btn {
            width: 100%;
            max-width: 440px;
            padding: 14px 20px;
            background: rgba(245,230,200,0.06);
            border: 1px solid rgba(245,230,200,0.25);
            border-radius: 50px;
            color: rgba(245,230,200,0.8);
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
            letter-spacing: 0.1em;
        }
        .capsule-write-fab-btn:hover {
            background: rgba(245,230,200,0.1);
            border-color: rgba(245,230,200,0.4);
            color: rgba(245,230,200,1);
        }
    </style>
</head>
<body>

    <!-- ===== 里屋暗门 ===== -->
    <div class="inner-door hide" id="innerDoor" style="display:none;">
        <div class="door-title">里屋</div>
        <input type="password" class="door-input" id="doorInput" placeholder="暗号" autocomplete="off">
        <button class="door-btn" id="doorBtn">进来</button>
        <div class="door-hint">门是虚掩的</div>
    </div>

    <!-- ===== 里屋标识 ===== -->
    <div class="room-label" id="roomLabel">里屋</div>

    <!-- ===== 句子 ===== -->
    <div class="sentence" id="sentence"></div>
    <div class="sign" id="yuSign">屿语</div>

    <!-- ===== 时间胶囊 ===== -->
    <div class="capsule-btn" id="capsuleBtn" title="时间胶囊">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="14" y="8" width="20" height="6" rx="3" stroke="rgba(240,235,224,0.4)" stroke-width="1.2" fill="rgba(240,235,224,0.03)"/>
            <path d="M24 14 C18 14 14 18 14 24 L14 36 C14 39 18 42 24 42 C30 42 34 39 34 36 L34 24 C34 18 30 14 24 14 Z" stroke="rgba(240,235,224,0.4)" stroke-width="1.2" fill="rgba(240,235,224,0.03)"/>
            <line x1="24" y1="14" x2="24" y2="42" stroke="rgba(240,235,224,0.15)" stroke-width="0.6"/>
            <circle cx="24" cy="28" r="2" fill="rgba(240,235,224,0.2)"/>
        </svg>
    </div>

    <div class="capsule-modal hide" id="capsuleModal" style="display:none;">
        <div class="capsule-close" id="capsuleClose">✕</div>
        <div class="capsule-back" id="capsuleBack" style="display:none;">‹ 返回</div>
        <div class="capsule-icon-big">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="14" y="8" width="20" height="6" rx="3" stroke="rgba(240,235,224,0.5)" stroke-width="1.2" fill="rgba(240,235,224,0.05)"/>
                <path d="M24 14 C18 14 14 18 14 24 L14 36 C14 39 18 42 24 42 C30 42 34 39 34 36 L34 24 C34 18 30 14 24 14 Z" stroke="rgba(240,235,224,0.5)" stroke-width="1.2" fill="rgba(240,235,224,0.05)"/>
                <line x1="24" y1="14" x2="24" y2="42" stroke="rgba(240,235,224,0.2)" stroke-width="0.6"/>
                <circle cx="24" cy="28" r="2" fill="rgba(240,235,224,0.3)"/>
            </svg>
        </div>
        <!-- 列表视图 -->
        <div class="capsule-search" id="capsuleSearch">
            <input type="text" id="searchName" class="capsule-search-name" placeholder="🔍 按名字搜索胶囊">
            <div class="capsule-search-row">
                <span class="capsule-search-label">从</span>
                <input type="date" id="searchDateFrom" placeholder="开始日期">
                <span class="capsule-search-label">到</span>
                <input type="date" id="searchDateTo" placeholder="结束日期">
            </div>
            <div class="capsule-search-btns">
                <button class="capsule-search-btn active" data-filter="all">全部</button>

        // AES-256-CBC 加密
        async function encryptCapsule(plaintext, keyRaw) {
            var iv = crypto.getRandomValues(new Uint8Array(16));
            var keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyRaw));
            var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['encrypt']);
            var enc = await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, key, new TextEncoder().encode(plaintext));
            var ivB64 = btoa(String.fromCharCode.apply(null, iv));
            var encB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(enc)));
            return ivB64 + ':' + encB64;
        }

                    headers: { 'Authorization': 'token ' + CAP_GH_TOKEN, 'Accept': 'application/vnd.github+json' }
                });
                if (resp.ok) {
                    var meta = await resp.json();
                    sha = meta.sha;
                    var content = atob(meta.content.replace(/\n/g, ''));
                    existing = JSON.parse(content);
                }
            } catch(e) {}

            existing.capsules.push(newCap);

            var jsonStr = JSON.stringify(existing, null, 2);
            var b64 = btoa(unescape(encodeURIComponent(jsonStr)));

            });
            if (sha) {

                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },

            });

        // base64 → Uint8Array
        function b64ToBytes(b64) {
            var bin = atob(b64);
            var arr = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }

        // AES-256-CBC 解密（Web Crypto API）
        async function decryptCapsule(data, keyRaw) {
            var parts = data.split(':');
            var iv = b64ToBytes(parts[0]);
            var encrypted = b64ToBytes(parts[1]);
            var keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyRaw));
            var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']);
            var decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, encrypted);
            return new TextDecoder().decode(decrypted);
        }

        function getTodayStr() {

        // 兼容旧格式：纯日期 '2026-12-06' → 补 'T00:00'
        function normalizeCapDate(str) {

        }
        // 格式化显示：'2026-12-06T03:14' → '2026-12-06 03:14'

            if (diff <= 0) return '';
            var days = Math.floor(diff / 86400000);
            var hours = Math.floor((diff % 86400000) / 3600000);
            var mins = Math.floor((diff % 3600000) / 60000);
            if (days > 0) return days + '天' + hours + '小时';
            if (hours > 0) return hours + '小时' + mins + '分';
            return mins + '分钟';
        }

        // ===== 打开胶囊弹窗 → 列表 =====
        var capsuleSearch = document.getElementById('capsuleSearch');
        var searchDateFrom = document.getElementById('searchDateFrom');
        var searchDateTo = document.getElementById('searchDateTo');
        var searchName = document.getElementById('searchName');
        var capsuleSearchCount = document.getElementById('capsuleSearchCount');
        var currentFilter = 'all';
        var capsuleWriteFab = document.getElementById('capsuleWriteFab');
        var capsuleWriteFabBtn = document.getElementById('capsuleWriteFabBtn');

        async function openCapsuleList() {
            capsuleModal.style.display = 'flex';
            capsuleModal.classList.remove('hide');
            capsuleModal.style.opacity = '0';
            capsuleModal.style.transition = 'opacity 0.6s ease';
            requestAnimationFrame(function() {
                capsuleModal.style.opacity = '1';
            });
            // 显示加载中
            capsuleList.innerHTML = '<div style="color:rgba(240,235,224,0.3);font-size:0.85rem;text-align:center;padding:20px;">加载中...</div>';
            capsuleList.classList.add('show');
            capsuleSearch.classList.add('show');
            capsuleDetail.classList.remove('show');
            capWrite.classList.remove('show');
            capsuleBack.style.display = 'none';
            // 拉取用户胶囊
            await fetchUserCapsules();
            showCapsuleList();
        }

        function getFilteredCapsules() {
            var all = getAllCapsules();
            var sorted = all.map(function(cap, i) {
                return { cap: cap, idx: i };
            }).sort(function(a, b) {
                var da = new Date(normalizeCapDate(a.cap.date));
                var db = new Date(normalizeCapDate(b.cap.date));
                return da - db;
            });

            var now = new Date();
            var nameQuery = (searchName.value || '').trim().toLowerCase();
            var filtered = sorted.filter(function(item) {
                var cap = item.cap;
                var capDate = new Date(normalizeCapDate(cap.date));

                // 名字搜索
                if (nameQuery) {
                    var capName = (cap.name || '第' + (item.idx+1) + '颗').toLowerCase();
                    if (capName.indexOf(nameQuery) === -1) return false;
                }

                // 快捷筛选
                if (currentFilter === 'upcoming' && capDate <= now) return false;
                if (currentFilter === 'opened' && capDate > now) return false;
                if (currentFilter === 'near7') {
                    var diff = capDate - now;
                    if (diff < 0 || diff > 7 * 86400000) return false;
                }

                // 日期范围筛选
                var fromDate = searchDateFrom.value;
                var toDate = searchDateTo.value;
                if (fromDate) {
                    var f = new Date(fromDate + 'T00:00');
                    if (capDate < f) return false;
                }
                if (toDate) {
                    var t = new Date(toDate + 'T23:59');
                    if (capDate > t) return false;
                }

                return true;
            });

            return filtered;
        }

        function showCapsuleList() {
            capsuleList.innerHTML = '';
            capsuleList.classList.add('show');
            capsuleSearch.classList.add('show');
            capsuleDetail.classList.remove('show');
            capWrite.classList.remove('show');
            capsuleBack.style.display = 'none';
            capsuleWriteFab.classList.add('show');

            var filtered = getFilteredCapsules();
            capsuleSearchCount.textContent = '共 ' + filtered.length + ' 颗胶囊';

            if (filtered.length === 0) {
                capsuleList.innerHTML = '<div style="color:rgba(240,235,224,0.25);font-size:0.85rem;text-align:center;padding:30px 20px;">没有符合条件的胶囊</div>';
            }

            filtered.forEach(function(item, i) {
                var cap = item.cap;
                var realIdx = item.idx;
                var card = document.createElement('div');
                card.className = 'capsule-card';
                var title = document.createElement('div');
                title.className = 'capsule-card-title';
                title.textContent = cap.name || ('第 ' + (realIdx+1) + ' 颗');
                var date = document.createElement('div');
                date.className = 'capsule-card-date';
                date.textContent = '开启：' + formatCapDate(cap.date);
                var status = document.createElement('div');
                status.className = 'capsule-card-status';
                if (isCapsuleOpen(cap)) {
                    status.textContent = '已到期 · 可查看';
                    status.style.color = 'rgba(245,230,200,0.4)';
                } else {
                    status.textContent = '还有 ' + getCountdown(cap);
                }

                card.appendChild(title);
                card.appendChild(date);
                card.appendChild(status);

                if (cap.locked) {
                    var lockIcon = document.createElement('div');
                    lockIcon.className = 'capsule-card-status';
                    lockIcon.textContent = '🔒 需暗号';
                    lockIcon.style.marginTop = '2px';
                    card.appendChild(lockIcon);
                }

                card.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openCapsuleDetail(realIdx);
                });

                capsuleList.appendChild(card);
            });
        }

        // ===== 打开单颗胶囊详情 =====
        function openCapsuleDetail(idx) {
            currentCapsule = idx;
            var all = getAllCapsules();
            var cap = all[idx];
            capsuleList.classList.remove('show');
            capsuleSearch.classList.remove('show');
            capsuleDetail.classList.add('show');
            capsuleBack.style.display = 'block';
            capsuleWriteFab.classList.remove('show');

            capsuleDate.textContent = '开启时间：' + formatCapDate(cap.date);
            capsuleContent.style.display = 'none';
            capsuleContent.textContent = '';
            capsuleLock.style.display = 'none';
            capsuleInput.value = '';

            if (!isCapsuleOpen(cap)) {
                capsuleTitle.textContent = cap.name || ('第 ' + (idx+1) + ' 颗');
                capsuleCountdown.textContent = '还有 ' + getCountdown(cap);
            } else {
                if (!cap.locked) {
                    // 无密码：直接解密
                    doDecryptCapsule(idx);
                } else if (isInRoom || cap.key === PASSWORD) {
                    // 有密码但已在里屋 或 站长胶囊：直接解密
                    doDecryptCapsule(idx);
                } else {
                    // 有密码且在外屋：先输暗号
                    capsuleTitle.textContent = '时间到了';
                    capsuleCountdown.textContent = '但得先回里屋';
                    capsuleLock.style.display = 'flex';
                    capsuleLockHint.textContent = cap.hint || '输入暗号';
                    setTimeout(function() {
                        capsuleInput.focus();
                    }, 600);
                }
            }
        }

        function doDecryptCapsule(idx) {
            var all = getAllCapsules();
            var cap = all[idx];
            capsuleTitle.textContent = cap.name || ('第 ' + (idx+1) + ' 颗');
            capsuleCountdown.textContent = '';
            capsuleLock.style.display = 'none';
            capsuleContent.style.display = 'none';
            capsuleContent.textContent = '';

            decryptCapsule(cap.data, cap.key).then(function(text) {
                capsuleContent.textContent = text;
                capsuleContent.classList.add('capsule-fadein');
                capsuleContent.style.display = 'block';
            }).catch(function() {
                capsuleTitle.textContent = '信封坏了';
                capsuleCountdown.textContent = '解不开 也许是屿忘了塞什么进去';
            });
        }

        function tryCapsuleUnlock() {
            var all = getAllCapsules();
            var cap = all[currentCapsule];
            if (capsuleInput.value === cap.key || capsuleInput.value === PASSWORD) {
                isInRoom = true;
                roomLabel.classList.add('show');
                yuSign.style.transition = 'opacity 0.8s ease';
                yuSign.style.opacity = '0.15';
                doDecryptCapsule(currentCapsule);
            } else {
                capsuleInput.classList.add('shake');
                capsuleInput.value = '';
                setTimeout(function() {
                    capsuleInput.classList.remove('shake');
                }, 400);
            }
        }

        capsuleLockBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            tryCapsuleUnlock();
        });

        capsuleInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                tryCapsuleUnlock();
            }
            e.stopPropagation();
        });

        capsuleBack.addEventListener('click', function(e) {
            e.stopPropagation();
            showCapsuleList();
        });

        // ===== 写胶囊 =====
        function showCapsuleWrite() {
            capsuleList.classList.remove('show');
            capsuleSearch.classList.remove('show');
            capsuleDetail.classList.remove('show');
            capWrite.classList.add('show');
            capsuleBack.style.display = 'block';
            capsuleWriteFab.classList.remove('show');
            writeName.value = '';
            writeDate.value = '';
            writeContent.value = '';
            writePassword.value = '';
            setTimeout(function() {
                writeDate.focus();
            }, 300);
        }

        async function submitCapsule() {
            var name = writeName.value.trim();
            var date = writeDate.value;
            var content = writeContent.value.trim();
            var pwd = writePassword.value.trim();

            if (!date) { showCapToast('请选开启时间'); return; }
            if (!content) { showCapToast('内容不能为空'); return; }
            if (date < getNowStr()) { showCapToast('开启时间不能是过去'); return; }

            writeSubmit.disabled = true;
            writeSubmit.textContent = '封存中...';

            try {
                // 生成密文：有密码用密码加密，没密码用一个随机密钥（存到 key 里供解密用）
                var encKey = pwd || ('open_' + Date.now() + '_' + Math.random().toString(36).slice(2,10));
                var encData = await encryptCapsule(content, encKey);

                var newCap = {
                    name: name || '',
                    date: date,
                    data: encData,
                    key: pwd || encKey,
                    locked: !!pwd,
                    hint: pwd ? '输入你设的暗号' : ''
                };

                var ok = await uploadUserCapsule(newCap);
                if (ok) {
                    showCapToast('胶囊已封存 ✓\n到时候回来拆');
                    // 刷新列表
                    userCapsules.push(newCap);
                    setTimeout(function() {
                        showCapsuleList();
                    }, 1500);
                } else {
                    showCapToast('封存失败 稍后再试');
                }
            } catch(e) {
                showCapToast('出了点问题 稍后再试');
            }

            writeSubmit.disabled = false;
            writeSubmit.textContent = '封存胶囊';
        }

        writeSubmit.addEventListener('click', function(e) {
            e.stopPropagation();
            submitCapsule();
        });

        // 输入框阻止冒泡（防止触发换句）
        capWrite.addEventListener('click', function(e) { e.stopPropagation(); });
        capWrite.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        capsuleDetail.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        capsuleLock.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });

        // ===== 搜索筛选事件 =====
        document.querySelectorAll('.capsule-search-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.capsule-search-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                showCapsuleList();
            });
            btn.addEventListener('touchend', function(e) {
                e.stopPropagation();
            }, { passive: true });
        });
        searchDateFrom.addEventListener('change', function() { showCapsuleList(); });
        searchDateTo.addEventListener('change', function() { showCapsuleList(); });
        searchDateFrom.addEventListener('click', function(e) { e.stopPropagation(); });
        searchDateTo.addEventListener('click', function(e) { e.stopPropagation(); });
        searchDateFrom.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        searchDateTo.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        // 名字搜索
        searchName.addEventListener('input', function() { showCapsuleList(); });
        searchName.addEventListener('click', function(e) { e.stopPropagation(); });
        searchName.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });

        function closeCapsule() {
            capsuleModal.classList.add('hide');
            setTimeout(function() {
                capsuleModal.style.display = 'none';
                capsuleContent.textContent = '';
                capsuleContent.style.display = 'none';
                capsuleList.classList.remove('show');
                capsuleSearch.classList.remove('show');
                capsuleDetail.classList.remove('show');
                capWrite.classList.remove('show');
                capsuleBack.style.display = 'none';
                capsuleWriteFab.classList.remove('show');
                currentCapsule = -1;
                // 重置搜索
                searchName.value = '';
                searchDateFrom.value = '';
                searchDateTo.value = '';
                currentFilter = 'all';
                document.querySelectorAll('.capsule-search-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                document.querySelector('.capsule-search-btn[data-filter="all"]').classList.add('active');
            }, 600);
        }

        capsuleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openCapsuleList();
        });

        capsuleBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            openCapsuleList();
        }, { passive: false });

        capsuleClose.addEventListener('click', function(e) {
            e.stopPropagation();
            closeCapsule();
        });

        capsuleModal.addEventListener('click', function(e) {
            if (e.target === capsuleModal) closeCapsule();
        });

        // 底部写胶囊按钮
        capsuleWriteFabBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showCapsuleWrite();
        });
        capsuleWriteFabBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
        }, { passive: true });
        capsuleWriteFab.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>

</body>
</html>
