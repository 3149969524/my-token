<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>屿语</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 句子样式 ===== */
        .sentence {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            font-weight: 300;
            color: #f0ebe0;
            font-size: 1.35rem;
            line-height: 2;
            text-align: center;
            max-width: 80%;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 1.2s ease;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(240, 235, 224, 0.08);
        }
        .sentence.show { opacity: 1; }

        /* 里屋句子带一点暖色 */
        .sentence.warm {
            color: #f5e6c8;
            text-shadow: 0 0 20px rgba(245, 230, 200, 0.12);
        }

        /* ===== 签名 ===== */
        .sign {
            position: fixed;
            bottom: 28px;
            right: 28px;
            writing-mode: vertical-rl;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.3);
            letter-spacing: 0.5em;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: color 0.3s ease, opacity 0.8s ease;
            z-index: 5;
        }

        /* ===== 里屋门 ===== */
        .inner-door {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a1029 0%, #070b1e 40%, #04060f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .inner-door.hide {
            opacity: 0;
            pointer-events: none;
        }
        .door-title {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 1.4rem;
            font-weight: 300;
            color: rgba(240, 235, 224, 0.7);
            letter-spacing: 0.3em;
            margin-bottom: 36px;
            text-shadow: 0 0 20px rgba(240, 235, 224, 0.08);
        }
        .door-input {
            width: 220px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f0ebe0;
            font-size: 0.95rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            letter-spacing: 0.1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .door-input:focus {
            border-color: rgba(240, 235, 224, 0.35);
        }
        .door-input::placeholder {
            color: rgba(240, 235, 224, 0.18);
            font-weight: 300;
        }
        .door-btn {
            margin-top: 18px;
            padding: 8px 36px;
            background: transparent;
            border: 1px solid rgba(240, 235, 224, 0.2);
            border-radius: 50px;
            color: rgba(240, 235, 224, 0.6);
            font-size: 0.85rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .door-btn:hover {
            background: rgba(240, 235, 224, 0.06);
            border-color: rgba(240, 235, 224, 0.4);
            color: #f0ebe0;
        }
        .door-hint {
            margin-top: 14px;
            font-size: 0.68rem;
            color: rgba(240, 235, 224, 0.15);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.1em;
        }
        .shake {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ===== 里屋标识 ===== */
        .room-label {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 0.65rem;
            font-weight: 300;
            color: rgba(245, 230, 200, 0.12);
            letter-spacing: 0.4em;
            user-select: none;
            -webkit-user-select: none;
            z-index: 5;
            display: none;
        }
        .room-label.show { display: block; }

        /* ===== 时间胶囊 ===== */
        .capsule-btn {
            position: fixed;
            bottom: 28px;
            left: 28px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            opacity: 0.25;
            transition: opacity 0.3s ease;
            z-index: 5;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-btn:hover { opacity: 0.5; }
        .capsule-btn svg {
            width: 100%;
            height: 100%;
        }

        .capsule-modal {
            position: fixed;
            inset: 0;
            background: #0a0418;
            background-image: url('galaxy_bg.jpg');
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 9999;
            transition: opacity 0.6s ease;
            padding: 50px 20px 30px;
            overflow-y: auto;
        }
        .capsule-modal::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(5,2,15,0.4) 0%, rgba(5,2,15,0.7) 100%);
            z-index: 0;
            pointer-events: none;
        }
        .capsule-modal > * { position: relative; z-index: 1; }
        .capsule-modal.show {
            display: flex;
        }
        .capsule-modal.hide {
            opacity: 0;
            pointer-events: none;
        }
        .capsule-icon-big {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .capsule-title {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(100,180,255,0.4);
        }
        .capsule-date {
            font-size: 0.78rem;
            color: rgba(100,180,255,0.4);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .capsule-countdown {
            font-size: 0.7rem;
            color: rgba(100,180,255,0.3);
            letter-spacing: 0.08em;
        }
        .capsule-content {
            max-width: 85%;
            max-height: 55vh;
            overflow-y: auto;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 1.08rem;
            font-weight: 300;
            line-height: 2.2;
            color: rgba(255,255,255,0.85);
            text-align: center;
            letter-spacing: 0.06em;
            white-space: pre-wrap;
            word-break: break-word;
            text-shadow: 0 0 20px rgba(100,180,255,0.15);
            padding: 10px;
        }
        .capsule-content::-webkit-scrollbar { width: 2px; }
        .capsule-content::-webkit-scrollbar-thumb { background: rgba(100,180,255,0.15); }
        .capsule-close {
            position: fixed;
            top: 18px; left: 18px;
            display: flex; align-items: center; gap: 6px;
            font-size: 0.8rem;
            color: rgba(180, 210, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            text-decoration: none; letter-spacing: 0.08em;
            z-index: 10001;
        }
        .capsule-close:hover { color: rgba(180, 210, 255, 0.9); }
        .capsule-close-arrow { font-size: 1.2rem; }
        .capsule-fadein {
            animation: capsuleFade 1.2s ease;
        }
        @keyframes capsuleFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 胶囊密码门 */
        .capsule-lock {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .capsule-input {
            width: 220px;
            padding: 10px 16px;
            background: rgba(5, 2, 15, 0.5);
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 10px;
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            letter-spacing: 0.1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-input:focus {
            border-color: rgba(100,180,255,0.5);
        }
        .capsule-input::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 300;
        }
        .capsule-lock-btn {
            margin-top: 18px;
            padding: 8px 36px;
            background: transparent;
            border: 1px solid rgba(100,180,255,0.2);
            border-radius: 50px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .capsule-lock-btn:hover {
            background: rgba(100,180,255,0.08);
            border-color: rgba(100,180,255,0.4);
            color: rgba(255,255,255,0.9);
        }
        .capsule-lock-hint {
            margin-top: 14px;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.2);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.1em;
        }

        /* 胶囊列表 */
        .capsule-list {
            display: none;
            flex-direction: column;
            gap: 14px;
            max-width: 440px;
            width: 100%;
            max-height: 65vh;
            overflow-y: auto;
            padding: 10px 5px 80px;
        }
        .capsule-list.show { display: flex; }
        .capsule-list::-webkit-scrollbar { width: 2px; }
        .capsule-list::-webkit-scrollbar-thumb { background: rgba(100,180,255,0.15); }

        /* 搜索筛选区 */
        .capsule-search {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            gap: 10px;
            margin-bottom: 16px;
            padding: 0 5px;
        }
        .capsule-search.show { display: flex; }
        .capsule-search-name {
            width: 100%;
            padding: 10px 14px;
            background: rgba(5, 2, 15, 0.5);
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 10px;
            color: rgba(255,255,255,0.9);
            font-size: 0.88rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-search-name:focus {
            border-color: rgba(100,180,255,0.5);
        }
        .capsule-search-name::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 300;
        }
        .capsule-search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .capsule-search-label {
            font-size: 0.78rem;
            color: rgba(100,180,255,0.4);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .capsule-search input[type="date"] {
            padding: 8px 12px;
            background: rgba(5, 2, 15, 0.5);
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 8px;
            color: rgba(255,255,255,0.9);
            font-size: 0.85rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            outline: none;
            color-scheme: dark;
            flex: 1;
            min-width: 0;
            transition: border-color 0.3s;
        }
        .capsule-search input[type="date"]:focus {
            border-color: rgba(100,180,255,0.5);
        }
        .capsule-search-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .capsule-search-btn {
            padding: 6px 18px;
            background: transparent;
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 50px;
            color: rgba(255,255,255,0.5);
            font-size: 0.78rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-search-btn:hover {
            border-color: rgba(100,180,255,0.35);
            color: rgba(255,255,255,0.8);
            background: rgba(100,180,255,0.05);
        }
        .capsule-search-btn.active {
            border-color: rgba(100,180,255,0.4);
            color: rgba(150,200,255,0.8);
            background: rgba(100,180,255,0.08);
        }
        .capsule-search-count {
            font-size: 0.72rem;
            color: rgba(100,180,255,0.3);
            letter-spacing: 0.05em;
            padding: 0 2px;
        }

        .capsule-card {
            padding: 20px 24px;
            background: rgba(15, 10, 35, 0.55);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100,180,255,0.12);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-card:hover {
            border-color: rgba(100,180,255,0.3);
            background: rgba(15, 10, 35, 0.65);
            box-shadow: 0 4px 25px rgba(100,180,255,0.1);
        }
        .capsule-card-title {
            font-size: 1.02rem;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.05em;
        }
        .capsule-card-date {
            font-size: 0.82rem;
            color: rgba(100,180,255,0.4);
            margin-top: 8px;
        }
        .capsule-card-status {
            font-size: 0.76rem;
            color: rgba(255,255,255,0.3);
            margin-top: 5px;
        }
        .capsule-detail {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .capsule-detail.show { display: flex; }
        .capsule-back {
            position: fixed;
            top: 18px;
            right: 24px;
            font-size: 0.8rem;
            color: rgba(180, 210, 255, 0.5);
            transition: color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            z-index: 10001;
            display: none;
        }
        .capsule-back:hover { color: rgba(180, 210, 255, 0.9); }

        /* 写胶囊表单 */
        .capsule-write {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            gap: 16px;
        }
        .capsule-write.show { display: flex; }
        .capsule-write label {
            font-size: 0.82rem;
            color: rgba(100,180,255,0.4);
            letter-spacing: 0.1em;
            align-self: flex-start;
            margin-bottom: -8px;
        }
        .capsule-write input[type="datetime-local"],
        .capsule-write input[type="date"],
        .capsule-write input[type="text"],
        .capsule-write textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(5, 2, 15, 0.5);
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 12px;
            color: rgba(255,255,255,0.9);
            font-size: 0.98rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .capsule-write input[type="date"]:focus,
        .capsule-write input[type="text"]:focus,
        .capsule-write textarea:focus {
            border-color: rgba(100,180,255,0.5);
        }
        .capsule-write input::placeholder,
        .capsule-write textarea::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 300;
        }
        .capsule-write textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.9;
        }
        .capsule-write input[type="date"],
        .capsule-write input[type="datetime-local"] {
            color-scheme: dark;
        }
        .capsule-write-btn {
            margin-top: 10px;
            padding: 12px 48px;
            background: transparent;
            border: 1px solid rgba(100,180,255,0.25);
            border-radius: 50px;
            color: rgba(255,255,255,0.7);
            font-size: 0.98rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .capsule-write-btn:hover {
            background: rgba(100,180,255,0.08);
            border-color: rgba(100,180,255,0.45);
            color: rgba(255,255,255,0.95);
        }
        .capsule-write-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .capsule-write-new-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 10, 35, 0.4);
            backdrop-filter: blur(10px);
            border: 1px dashed rgba(100,180,255,0.2);
            border-radius: 14px;
            color: rgba(255,255,255,0.4);
            font-size: 0.92rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-write-new-btn:hover {
            border-color: rgba(100,180,255,0.4);
            color: rgba(255,255,255,0.7);
            background: rgba(100,180,255,0.05);
        }
        .capsule-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: rgba(15,10,35,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100,180,255,0.2);
            border-radius: 16px;
            padding: 30px 40px;
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            z-index: 10002;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .capsule-toast.show { opacity: 1; }

        /* 固定底部写胶囊按钮 */
        .capsule-write-fab {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(7,11,30,0.85) 0%, rgba(7,11,30,0.98) 60%, rgba(7,11,30,1) 100%);
            border-top: 1px solid rgba(240,235,224,0.08);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10003;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .capsule-write-fab.show { display: flex; }
        .capsule-write-fab-btn {
            width: 100%;
            max-width: 440px;
            padding: 14px 20px;
            background: rgba(245,230,200,0.06);
            border: 1px solid rgba(245,230,200,0.25);
            border-radius: 50px;
            color: rgba(245,230,200,0.8);
            font-size: 0.95rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
            letter-spacing: 0.1em;
        }
        .capsule-write-fab-btn:hover {
            background: rgba(245,230,200,0.1);
            border-color: rgba(245,230,200,0.4);
            color: rgba(245,230,200,1);
        }

        /* 管理员 */
        .capsule-admin-bar {
            display: none;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 6px;
        }
        .capsule-admin-bar.show { display: flex; }
        .capsule-admin-btn {
            padding: 6px 14px;
            background: rgba(245,230,200,0.06);
            border: 1px solid rgba(245,230,200,0.2);
            border-radius: 20px;
            color: rgba(245,230,200,0.7);
            font-size: 0.8rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-admin-btn:hover {
            background: rgba(245,230,200,0.12);
            color: rgba(245,230,200,1);
        }
        .capsule-admin-badge {
            font-size: 0.75rem;
            color: rgba(245,230,200,0.5);
            letter-spacing: 0.05em;
        }
        .capsule-card-delete {
            display: none;
            padding: 4px 12px;
            background: rgba(255,80,80,0.08);
            border: 1px solid rgba(255,80,80,0.2);
            border-radius: 16px;
            color: rgba(255,120,120,0.7);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .capsule-admin-mode .capsule-card-delete { display: inline-block; }
        .capsule-card-delete:hover {
            background: rgba(255,80,80,0.15);
            color: rgba(255,120,120,1);
        }
        .capsule-detail-admin {
            display: none;
            margin-top: 16px;
            text-align: center;
        }
        .capsule-admin-mode .capsule-detail-admin { display: block; }
        .capsule-detail-delete-btn {
            padding: 10px 24px;
            background: rgba(255,80,80,0.08);
            border: 1px solid rgba(255,80,80,0.25);
            border-radius: 20px;
            color: rgba(255,120,120,0.8);
            font-size: 0.85rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .capsule-detail-delete-btn:hover {
            background: rgba(255,80,80,0.15);
            color: rgba(255,150,150,1);
        }
        .capsule-admin-prompt {
            display: none;

        // AES-256-CBC 加密
        async function encryptCapsule(plaintext, keyRaw) {
            var iv = crypto.getRandomValues(new Uint8Array(16));
            var keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyRaw));
            var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['encrypt']);
            var enc = await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, key, new TextEncoder().encode(plaintext));
            var ivB64 = btoa(String.fromCharCode.apply(null, iv));
            var encB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(enc)));
            return ivB64 + ':' + encB64;
        }

        // base64 → Uint8Array
        function b64ToBytes(b64) {
            var bin = atob(b64);
            var arr = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }

        // AES-256-CBC 解密（Web Crypto API）
        async function decryptCapsule(data, keyRaw) {
            var parts = data.split(':');
            var iv = b64ToBytes(parts[0]);
            var encrypted = b64ToBytes(parts[1]);
            var keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyRaw));
            var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']);
            var decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, encrypted);
            return new TextDecoder().decode(decrypted);
        }

        // 日期/时间辅助

            return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + 'T' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        function getTodayStr() {
            var now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
        }
        // 兼容旧格式：纯日期 '2026-12-06' → 补 'T00:00'
        function normalizeCapDate(str) {
            if (str && str.length === 10) return str + 'T00:00';
            return str || getTodayStr() + 'T00:00';
        }
        // 格式化显示：'2026-12-06T03:14' → '2026-12-06 03:14'
        function formatCapDate(str) {
            var s = normalizeCapDate(str);
            return s.replace('T', ' ');
        }
        function isCapsuleOpen(cap) {
            var openDate = new Date(normalizeCapDate(cap.date));
            var now = new Date();
            return now >= openDate;
        }
        function getCountdown(cap) {
            var openDate = new Date(normalizeCapDate(cap.date));
            var now = new Date();
            var diff = openDate - now;
            if (diff <= 0) return '';
            var days = Math.floor(diff / 86400000);
            var hours = Math.floor((diff % 86400000) / 3600000);
            var mins = Math.floor((diff % 3600000) / 60000);
            if (days > 0) return days + '天' + hours + '小时';
            if (hours > 0) return hours + '小时' + mins + '分';
            return mins + '分钟';
        }

                return;
            }
            capsuleModal.classList.add('hide');
            setTimeout(function() {
                capsuleModal.style.display = 'none';
                capsuleContent.textContent = '';
                capsuleContent.style.display = 'none';
                capsuleList.classList.remove('show');
                capsuleSearch.classList.remove('show');
                capsuleDetail.classList.remove('show');
                capWrite.classList.remove('show');
                capsuleBack.style.display = 'none';
                capsuleWriteFab.classList.remove('show');
                // 重置管理员
                isAdminMode = false;
                isAdminDeleteMode = false;
                capsuleAdminBar.classList.remove('show');
                capsuleAdminPrompt.classList.remove('show');
                capsuleModal.classList.remove('capsule-admin-mode');
                currentCapsule = -1;
                // 重置搜索
                searchName.value = '';
                searchDateFrom.value = '';
                searchDateTo.value = '';
                currentFilter = 'all';
                document.querySelectorAll('.capsule-search-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                document.querySelector('.capsule-search-btn[data-filter="all"]').classList.add('active');
            }, 600);
        }

        // 胶囊入口按钮已移至首页，屿语页不再需要
        if (capsuleBtn) {
            capsuleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                openCapsuleList();
            });

            capsuleBtn.addEventListener('touchend', function(e) {
                e.stopPropagation();
                e.preventDefault();
                openCapsuleList();
            }, { passive: false });
        }

        capsuleClose.addEventListener('click', function(e) {
            e.stopPropagation();
            closeCapsule();
        });

        capsuleModal.addEventListener('click', function(e) {
            if (e.target === capsuleModal) {
                // 在详情页或写胶囊页时，点空白不做任何事（避免误触）
                if (capsuleDetail.classList.contains('show') || capWrite.classList.contains('show')) {
                    return;
                } else {
                    closeCapsule();
                }
            }
        });

        // ===== 管理员功能 =====
        // 管理员登录
        capsuleAdminLoginBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (capsuleAdminPwd.value === PASSWORD) {
                isAdminMode = true;
                isAdminDeleteMode = true;
                capsuleAdminPrompt.classList.remove('show');
                capsuleAdminBar.classList.add('show');
                capsuleModal.classList.add('capsule-admin-mode');
                capsuleAdminToggleBtn.textContent = '删除模式 开';
                capsuleAdminPwd.value = '';
                showCapToast('已进入管理模式');
                showCapsuleList();
            } else {
                showCapToast('密码不对');
                capsuleAdminPwd.value = '';
            }
        });
        capsuleAdminLoginBtn.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        capsuleAdminPwd.addEventListener('click', function(e) { e.stopPropagation(); });
        capsuleAdminPwd.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });
        capsuleAdminPwd.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') capsuleAdminLoginBtn.click();
        });

        // 切换删除模式
        capsuleAdminToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            isAdminDeleteMode = !isAdminDeleteMode;
            capsuleAdminToggleBtn.textContent = '删除模式 ' + (isAdminDeleteMode ? '开' : '关');
            capsuleModal.classList.toggle('capsule-admin-mode', isAdminDeleteMode);
            showCapsuleList();
        });

        // 退出管理模式
        capsuleAdminExitBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            isAdminMode = false;
            isAdminDeleteMode = false;
            capsuleAdminBar.classList.remove('show');
            capsuleModal.classList.remove('capsule-admin-mode');
            showCapToast('已退出管理模式');
            showCapsuleList();
        });

        // 详情页删除按钮
        capsuleDetailDeleteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (currentCapsule >= 0) deleteCapsule(currentCapsule);
        });

        // 底部写胶囊按钮
        capsuleWriteFabBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showCapsuleWrite();
        });
        capsuleWriteFabBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
        }, { passive: true });
        capsuleWriteFab.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>

</body>
</html>
