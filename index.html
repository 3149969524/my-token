<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>望潮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 真实银河照片背景层1（Kai Pilger - 5150x3433, 2690万浏览） ===== */
        .galaxy-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('galaxy_bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 1;
            transition: opacity 6s ease;
        }

        /* ===== 真实银河照片背景层2（Adi K - 3152x4541, 5000万浏览） ===== */
        .galaxy_bg2 {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('galaxy_bg2.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 6s ease;
            mix-blend-mode: screen;
        }

        /* 暗角 - 让中心聚焦 */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 50% 50%, rgba(5,2,15,0.1) 0%, transparent 60%),
                radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.85) 100%);
        }

        /* Canvas 星空叠加 - 闪烁星 + 流星 */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== 功能热点 ===== */
        .hotspot-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
        }

        .hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .hotspot-core {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(100,180,255,0.8) 40%, rgba(60,120,255,0.3) 70%, transparent 100%);
            box-shadow:
                0 0 20px rgba(100,180,255,0.8),
                0 0 50px rgba(60,120,255,0.4),
                0 0 100px rgba(40,80,200,0.2);
            animation: hotspotPulse 3s ease-in-out infinite;
            position: relative;
        }
        .hotspot:nth-child(2) .hotspot-core { animation-delay: 0.5s; }
        .hotspot:nth-child(3) .hotspot-core { animation-delay: 1s; }
        .hotspot:nth-child(4) .hotspot-core { animation-delay: 1.5s; }

        @keyframes hotspotPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(100,180,255,0.8), 0 0 50px rgba(60,120,255,0.4), 0 0 100px rgba(40,80,200,0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px rgba(100,180,255,1), 0 0 80px rgba(60,120,255,0.6), 0 0 150px rgba(40,80,200,0.3);
                transform: scale(1.3);
            }
        }

        .hotspot-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px; height: 48px;
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 50%;
            animation: ringExpand 3s ease-in-out infinite;
        }
        .hotspot:nth-child(2) .hotspot-ring { animation-delay: 0.5s; }
        .hotspot:nth-child(3) .hotspot-ring { animation-delay: 1s; }
        .hotspot:nth-child(4) .hotspot-ring { animation-delay: 1.5s; }

        @keyframes ringExpand {
            0% { width: 24px; height: 24px; opacity: 0.8; }
            100% { width: 100px; height: 100px; opacity: 0; }
        }

        /* ===== 扩散光圈波纹 ===== */
        .hotspot-ripple {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1.5px solid rgba(120,190,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: rippleWave 4s ease-out forwards;
        }

        @keyframes rippleWave {
            0% {
                width: 24px; height: 24px;
                opacity: 0.7;
                border-width: 2px;
                border-color: rgba(140,200,255,0.6);
                box-shadow: 0 0 12px rgba(100,180,255,0.4), inset 0 0 8px rgba(100,180,255,0.2);
            }
            25% {
                opacity: 0.45;
                border-width: 1.2px;
                box-shadow: 0 0 8px rgba(100,180,255,0.2);
            }
            60% {
                opacity: 0.2;
                border-width: 0.8px;
                box-shadow: 0 0 4px rgba(100,180,255,0.1);
            }
            100% {
                width: 210px; height: 210px;
                opacity: 0;
                border-width: 0.5px;
                border-color: rgba(100,180,255,0);
                box-shadow: 0 0 0px rgba(100,180,255,0);
            }
        }

        .hotspot.is-active .hotspot-core {
            animation: none;
            background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(150,200,255,1) 30%, rgba(80,140,255,0.5) 70%, transparent 100%);
            box-shadow: 0 0 50px rgba(150,200,255,1), 0 0 120px rgba(60,120,255,0.6);
            transform: scale(1.6);
        }

        .hotspot-label {
            margin-top: 18px;
            white-space: nowrap;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.2em;
            text-shadow: 0 0 14px rgba(100,180,255,0.5), 0 0 28px rgba(0,0,0,0.8);
            transition: color 0.3s, text-shadow 0.3s, transform 0.3s;
        }
        .hotspot.is-active .hotspot-label {
            color: rgba(255,255,255,1);
            text-shadow: 0 0 20px rgba(150,200,255,0.8), 0 0 40px rgba(0,0,0,0.8);
            transform: translateY(2px);
        }

        .hotspot-sub {
            margin-top: 3px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.3em;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* ===== 标题 ===== */
        .title-zone {
            position: fixed;
            top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            text-align: center;
            pointer-events: none;
        }
        .title-main {
            font-size: 2.2rem;
            font-weight: 100;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.4em;
            text-shadow:
                0 0 20px rgba(255,255,255,0.15),
                0 0 50px rgba(100,150,255,0.1);
            white-space: nowrap;
        }
        .title-sub {
            margin-top: 10px;
            font-size: 0.6rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.6em;
        }

        /* ===== 顶部导航 ===== */
        .nav-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .nav-logo {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-decoration: none;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
        }
        .nav-links { display: flex; gap: 16px; }
        .nav-links a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            transition: color 0.3s;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .nav-links a:hover { color: rgba(255,255,255,0.9); }

        .hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255,255,255,0.25);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 3s ease forwards;
            animation-delay: var(--d, 0s);
        }
        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 600px) {
            .title-main { font-size: 1.4rem; letter-spacing: 0.3em; }
            .title-sub { font-size: 0.45rem; letter-spacing: 0.4em; }
            .hotspot-core { width: 20px; height: 20px; }
            .hotspot-label { font-size: 0.68rem; letter-spacing: 0.12em; margin-top: 14px; }
            .hotspot-sub { font-size: 0.48rem; }
            .nav-links { gap: 10px; }
            .nav-links a { font-size: 0.66rem; }
            .nav-logo { font-size: 0.78rem; }
            .title-zone { top: 40%; }
        }
    </style>
</head>
<body>

    <!-- 真实银河系照片背景（两张轮播） -->
    <div class="galaxy-bg fade-in"></div>
    <div class="galaxy_bg2"></div>
    <div class="vignette"></div>

    <!-- Canvas 星空叠加 -->
    <canvas id="starfield"></canvas>
<!-- 顶部导航已移除，纯沉浸式星空 -->


    <!-- 功能热点 -->
    <div class="hotspot-layer fade-in" style="--d: 0.8s;">
        <a href="board.html" class="hotspot" style="left: 28%; top: 38%;">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">留言板</span>
            <span class="hotspot-sub">MESSAGE</span>
        </a>
        <a href="yu.html" class="hotspot" style="left: 68%; top: 32%;">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">屿语</span>
            <span class="hotspot-sub">WHISPERS</span>
        </a>
        <a href="yu.html#capsule" class="hotspot" style="left: 72%; top: 70%;">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">时间胶囊</span>
            <span class="hotspot-sub">CAPSULE</span>
        </a>
        <a href="about.html" class="hotspot" style="left: 22%; top: 72%;">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">关于</span>
            <span class="hotspot-sub">ABOUT</span>
        </a>
    </div>

    <!-- 标题 -->
    <div class="title-zone fade-in" style="--d: 0.5s;">
        <div class="title-main">望 潮</div>
        <div class="title-sub">WANG CHAO</div>
    </div>

    <div class="hint fade-in" style="--d: 2s;">点击光点探索 · 漂浮在银河中</div>

    <script>
        // ===== 背景轮播 =====
        const bg1 = document.querySelector('.galaxy-bg');
        const bg2 = document.querySelector('.galaxy_bg2');
        let bgToggle = false;
        function rotateBg() {
            bgToggle = !bgToggle;
            bg1.style.opacity = bgToggle ? '0' : '1';
            bg2.style.opacity = bgToggle ? '0.85' : '0';
        }
        setInterval(rotateBg, 15000);

        // ===== Canvas 星空 =====
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let bigStars = [];
        let shootingStars = [];
        let t = 0;

        function initStars() {
            // 普通闪烁星（超大密度）
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 800);
            for (let i = 0; i < count; i++) {
                const ct = Math.random();
                let color;
                if (ct > 0.92) color = '180,210,255';
                else if (ct > 0.78) color = '255,235,200';
                else if (ct > 0.62) color = '255,210,180';
                else color = '255,255,250';

                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.1 + 0.3,
                    baseAlpha: Math.random() * 0.5 + 0.15,
                    twinkleSpeed: Math.random() * 0.022 + 0.004,
                    twinklePhase: Math.random() * Math.PI * 2,
                    color: color,
                    spikeAngle: Math.random() * Math.PI
                });
            }

            // 大亮星（密度大幅增加）
            bigStars = [];
            const bigCount = Math.floor((canvas.width * canvas.height) / 30000);
            for (let i = 0; i < bigCount; i++) {
                const ct = Math.random();
                let color;
                if (ct > 0.7) color = '180,210,255';
                else if (ct > 0.4) color = '255,240,210';
                else color = '255,220,200';

                bigStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.3 + 1.3,
                    baseAlpha: Math.random() * 0.35 + 0.5,
                    twinkleSpeed: Math.random() * 0.016 + 0.003,
                    twinklePhase: Math.random() * Math.PI * 2,
                    color: color,
                    spikeAngle: Math.random() * Math.PI
                });
            }
        }

        function createShootingStar() {
            // 从8个方向随机发射流星
            const dir = Math.floor(Math.random() * 8);
            let x, y, vx, vy;
            const speed = Math.random() * 4 + 7;
            const angleSpread = Math.random() * 0.6 - 0.3; // 微随机偏角

            if (dir === 0) {        // 左→右
                x = -80; y = Math.random() * canvas.height * 0.7;
                vx = speed; vy = speed * 0.3 + angleSpread * speed;
            } else if (dir === 1) { // 右→左
                x = canvas.width + 80; y = Math.random() * canvas.height * 0.7;
                vx = -speed; vy = speed * 0.3 + angleSpread * speed;
            } else if (dir === 2) { // 上→下
                x = Math.random() * canvas.width; y = -80;
                vx = speed * 0.3 + angleSpread * speed; vy = speed;
            } else if (dir === 3) { // 下→上
                x = Math.random() * canvas.width; y = canvas.height + 80;
                vx = speed * 0.3 + angleSpread * speed; vy = -speed;
            } else if (dir === 4) { // 左上→右下
                x = -80; y = -80;
                vx = speed * 0.75; vy = speed * 0.75;
            } else if (dir === 5) { // 右上→左下
                x = canvas.width + 80; y = -80;
                vx = -speed * 0.75; vy = speed * 0.75;
            } else if (dir === 6) { // 左下→右上
                x = -80; y = canvas.height + 80;
                vx = speed * 0.75; vy = -speed * 0.75;
            } else {                // 右下→左上
                x = canvas.width + 80; y = canvas.height + 80;
                vx = -speed * 0.75; vy = -speed * 0.75;
            }

            shootingStars.push({ x, y, vx, vy, life: 1, trail: [], ripples: [], rippleTimer: 0 });
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 普通星（含星爆效果）
            for (const s of stars) {
                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.35;
                const a = Math.max(0, alpha);
                const c = s.color;

                // 星爆：闪烁亮度超过阈值时绽放十字光芒
                if (a > 0.42) {
                    const burstStrength = (a - 0.42) / 0.58; // 0~1
                    const burstLen = s.r * 5 * burstStrength;

                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.spikeAngle + t * 0.00008);

                    // 水平光芒
                    const hg = ctx.createLinearGradient(-burstLen, 0, burstLen, 0);
                    hg.addColorStop(0, 'rgba(0,0,0,0)');
                    hg.addColorStop(0.45, `rgba(${c},${burstStrength * 0.25})`);
                    hg.addColorStop(0.5, `rgba(255,255,255,${burstStrength * 0.5})`);
                    hg.addColorStop(0.55, `rgba(${c},${burstStrength * 0.25})`);
                    hg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = hg;
                    ctx.fillRect(-burstLen, -0.35, burstLen * 2, 0.7);

                    // 垂直光芒
                    ctx.rotate(Math.PI / 2);
                    const vg = ctx.createLinearGradient(-burstLen, 0, burstLen, 0);
                    vg.addColorStop(0, 'rgba(0,0,0,0)');
                    vg.addColorStop(0.45, `rgba(${c},${burstStrength * 0.18})`);
                    vg.addColorStop(0.5, `rgba(255,255,255,${burstStrength * 0.38})`);
                    vg.addColorStop(0.55, `rgba(${c},${burstStrength * 0.18})`);
                    vg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = vg;
                    ctx.fillRect(-burstLen, -0.3, burstLen * 2, 0.6);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${c},${a})`;
                ctx.fill();
            }

            // 大亮星
            for (const s of bigStars) {
                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.4;
                const a = Math.max(0, alpha);
                const c = s.color;

                const haloR = s.r * 6;
                const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, haloR);
                grad.addColorStop(0, `rgba(${c},${a * 0.25})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(s.x, s.y, haloR, 0, Math.PI * 2);
                ctx.fill();

                const spikeLen = s.r * 9 * a;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.spikeAngle + t * 0.0001);

                const sg = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
                sg.addColorStop(0, 'rgba(0,0,0,0)');
                sg.addColorStop(0.48, `rgba(${c},${a * 0.4})`);
                sg.addColorStop(0.5, `rgba(255,255,255,${a * 0.7})`);
                sg.addColorStop(0.52, `rgba(${c},${a * 0.4})`);
                sg.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg;
                ctx.fillRect(-spikeLen, -0.6, spikeLen * 2, 1.2);

                ctx.rotate(Math.PI / 2);
                const sg2 = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
                sg2.addColorStop(0, 'rgba(0,0,0,0)');
                sg2.addColorStop(0.48, `rgba(${c},${a * 0.3})`);
                sg2.addColorStop(0.5, `rgba(255,255,255,${a * 0.5})`);
                sg2.addColorStop(0.52, `rgba(${c},${a * 0.3})`);
                sg2.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg2;
                ctx.fillRect(-spikeLen, -0.5, spikeLen * 2, 1);
                ctx.restore();

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${a})`;
                ctx.fill();
            }

                        // 流星
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.trail.push({ x: ss.x, y: ss.y });
                if (ss.trail.length > 30) ss.trail.shift();

                // 沿运动方向生成3D光环
                ss.rippleTimer++;
                if (ss.rippleTimer % 6 === 0 && ss.life > 0.3) {
                    const angle = Math.atan2(ss.vy, ss.vx);
                    ss.ripples.push({ x: ss.x, y: ss.y, life: 1, angle: angle });
                }

                // 绘制3D光环
                for (let k = ss.ripples.length - 1; k >= 0; k--) {
                    const rp = ss.ripples[k];
                    const rpLife = rp.life;
                    const rpRadius = (1 - rpLife) * 32 + 3;

                    // 椭圆光环主体（3D透视效果）
                    const ringW = rpRadius * 1.6;
                    const ringH = rpRadius * 0.55;

                    ctx.save();
                    ctx.translate(rp.x, rp.y);
                    ctx.rotate(rp.angle);

                    // 外层柔光
                    const outerGrad = ctx.createRadialGradient(0, 0, ringH * 0.8, 0, 0, ringW);
                    outerGrad.addColorStop(0, `rgba(100,180,255,0)`);
                    outerGrad.addColorStop(0.7, `rgba(100,180,255,${rpLife * 0.12})`);
                    outerGrad.addColorStop(1, 'rgba(100,180,255,0)');
                    ctx.fillStyle = outerGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 主光环线 - 透视椭圆
                    ctx.lineWidth = 1.5 * rpLife;
                    ctx.strokeStyle = `rgba(140,200,255,${rpLife * 0.5})`;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // 高光弧（3D球体上半部反光）
                    ctx.lineWidth = 2 * rpLife;
                    ctx.strokeStyle = `rgba(255,255,255,${rpLife * 0.35})`;
                    ctx.beginPath();
                    ctx.ellipse(0, -ringH * 0.35, ringW * 0.78, ringH * 0.78, 0, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();

                    // 底部暗影弧（3D球体下半部暗面）
                    ctx.lineWidth = 1 * rpLife;
                    ctx.strokeStyle = `rgba(60,100,180,${rpLife * 0.18})`;
                    ctx.beginPath();
                    ctx.ellipse(0, ringH * 0.35, ringW * 0.78, ringH * 0.78, 0, Math.PI * 0.15, Math.PI * 0.85);
                    ctx.stroke();

                    ctx.restore();

                    rp.life -= 0.025;
                    if (rp.life <= 0) ss.ripples.splice(k, 1);
                }

                for (let j = 0; j < ss.trail.length; j++) {
                    const tr = ss.trail[j];
                    const fade = (j / ss.trail.length) * ss.life;
                    ctx.beginPath();
                    ctx.arc(tr.x, tr.y, 1.8 * (j / ss.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${fade * 0.7})`;
                    ctx.fill();
                }

                const grad = ctx.createRadialGradient(ss.x, ss.y, 0, ss.x, ss.y, 14);
                grad.addColorStop(0, `rgba(255,255,255,${ss.life * 0.6})`);
                grad.addColorStop(0.3, `rgba(200,220,255,${ss.life * 0.25})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${ss.life})`;
                ctx.fill();

                ss.x += ss.vx;
                ss.y += ss.vy;
                ss.life -= 0.006;

                if (ss.life <= 0 || ss.x < -150 || ss.x > canvas.width + 150) {
                    shootingStars.splice(i, 1);
                }
            }
        }

        function animate() {
            drawCanvas();
            t++;
            requestAnimationFrame(animate);
        }

        setInterval(() => {
            if (Math.random() > 0.55 && shootingStars.length < 4) {
                createShootingStar();
            }
        }, 3500);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        resize();
        animate();
        window.addEventListener('resize', resize);

        function resetHotspots() {
            document.querySelectorAll('.hotspot').forEach(h => {
                h.classList.remove('is-active');
            });
        }

        document.querySelectorAll('.hotspot').forEach(h => {
            // 触摸开始：添加 active 状态
            h.addEventListener('touchstart', (e) => {
                resetHotspots();
                e.currentTarget.classList.add('is-active');
            }, { passive: true });

            // 鼠标进入（桌面端）
            h.addEventListener('mouseenter', (e) => {
                e.currentTarget.classList.add('is-active');
            });

            // 鼠标离开（桌面端）
            h.addEventListener('mouseleave', (e) => {
                e.currentTarget.classList.remove('is-active');
            });
        });

        // 返回页面时重置所有光点
        window.addEventListener('pageshow', () => {
            resetHotspots();
        });

        // ===== 周期性扩散光圈波纹 =====
        function emitRipple(hotspot) {
            const core = hotspot.querySelector('.hotspot-core');
            if (!core) return;
            const ripple = document.createElement('div');
            ripple.className = 'hotspot-ripple';
            core.appendChild(ripple);
            // 动画结束后自动移除
            ripple.addEventListener('animationend', () => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            });
            // 安全兜底：4.5s 后强制移除
            setTimeout(() => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            }, 4500);
        }

        const hotspots = document.querySelectorAll('.hotspot');
        // 每个光点错开发射节奏，营造不同步的扩散感
        hotspots.forEach((h, i) => {
            // 首次延迟不同，让各光点波纹错开
            const initialDelay = i * 1200;
            setTimeout(() => {
                emitRipple(h);
                // 之后每隔 5 秒发射一次
                setInterval(() => {
                    emitRipple(h);
                }, 5000);
            }, initialDelay);
        });
    </script>

</body>
