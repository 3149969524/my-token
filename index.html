<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>望潮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 加载占位背景（图片加载前显示纯黑+暗紫渐变） ===== */
        .loading-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0418 0%, #050210 50%, #000 100%);
            transition: opacity 1.5s ease;
        }
        .loading-bg.hide { opacity: 0; pointer-events: none; }

        /* ===== 真实银河照片背景层1 ===== */
        .galaxy-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('galaxy_bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .galaxy-bg.loaded { opacity: 1; transition: opacity 2.5s ease; }

        /* ===== 真实银河照片背景层2 ===== */
        .galaxy_bg2 {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('galaxy_bg2.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 6s ease;
            mix-blend-mode: screen;
        }

        /* 暗角 - 让中心聚焦 */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 50% 50%, rgba(5,2,15,0.1) 0%, transparent 60%),
                radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.85) 100%);
        }

        /* Canvas 星空叠加 - 闪烁星 + 流星 */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== 功能热点 ===== */
        .hotspot-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
        }

        .hotspot {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .hotspot-core {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(100,180,255,0.8) 40%, rgba(60,120,255,0.3) 70%, transparent 100%);
            box-shadow:
                0 0 20px rgba(100,180,255,0.8),
                0 0 50px rgba(60,120,255,0.4),
                0 0 100px rgba(40,80,200,0.2);
            animation: hotspotPulse 5s ease-in-out infinite;
            position: relative;
        }
        /* 十字光芒 - 水平 */
        .hotspot-core::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.7) 45%, #fff 50%, rgba(255,255,255,0.7) 55%, transparent 100%);
            pointer-events: none;
        }
        /* 十字光芒 - 垂直 */
        .hotspot-core::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 1px; height: 70px;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.7) 45%, #fff 50%, rgba(255,255,255,0.7) 55%, transparent 100%);
            pointer-events: none;
        }
        .hotspot:nth-child(2) .hotspot-core { animation-delay: 0.8s; }
        .hotspot:nth-child(3) .hotspot-core { animation-delay: 1.6s; }
        .hotspot:nth-child(4) .hotspot-core { animation-delay: 2.4s; }

        @keyframes hotspotPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(100,180,255,0.8), 0 0 50px rgba(60,120,255,0.4), 0 0 100px rgba(40,80,200,0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(100,180,255,0.9), 0 0 65px rgba(60,120,255,0.5), 0 0 120px rgba(40,80,200,0.25);
                transform: scale(1.15);
            }
        }

        .hotspot-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px; height: 48px;
            border: 1px solid rgba(100,180,255,0.15);
            border-radius: 50%;
            animation: ringExpand 5s ease-in-out infinite;
        }
        .hotspot:nth-child(2) .hotspot-ring { animation-delay: 0.8s; }
        .hotspot:nth-child(3) .hotspot-ring { animation-delay: 1.6s; }
        .hotspot:nth-child(4) .hotspot-ring { animation-delay: 2.4s; }

        @keyframes ringExpand {
            0% { width: 24px; height: 24px; opacity: 0.8; }
            100% { width: 100px; height: 100px; opacity: 0; }
        }

        /* ===== 扩散光圈波纹 ===== */
        .hotspot-ripple {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1.5px solid rgba(120,190,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: rippleWave 6s ease-out forwards;
        }

        @keyframes rippleWave {
            0% {
                width: 24px; height: 24px;
                opacity: 0.7;
                border-width: 2px;
                border-color: rgba(140,200,255,0.6);
                box-shadow: 0 0 12px rgba(100,180,255,0.4), inset 0 0 8px rgba(100,180,255,0.2);
            }
            25% {
                opacity: 0.45;
                border-width: 1.2px;
                box-shadow: 0 0 8px rgba(100,180,255,0.2);
            }
            60% {
                opacity: 0.2;
                border-width: 0.8px;
                box-shadow: 0 0 4px rgba(100,180,255,0.1);
            }
            100% {
                width: 210px; height: 210px;
                opacity: 0;
                border-width: 0.5px;
                border-color: rgba(100,180,255,0);
                box-shadow: 0 0 0px rgba(100,180,255,0);
            }
        }

        .hotspot.is-active .hotspot-core {
            animation: none;
            background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(150,200,255,1) 30%, rgba(80,140,255,0.5) 70%, transparent 100%);
            box-shadow: 0 0 50px rgba(150,200,255,1), 0 0 120px rgba(60,120,255,0.6);
        }

        .hotspot-label {
            margin-top: 18px;
            white-space: nowrap;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.2em;
            text-shadow: 0 0 14px rgba(100,180,255,0.5), 0 0 28px rgba(0,0,0,0.8);
            transition: color 0.3s, text-shadow 0.3s, transform 0.3s;
        }
        .hotspot.is-active .hotspot-label {
            color: rgba(255,255,255,1);
            text-shadow: 0 0 20px rgba(150,200,255,0.8), 0 0 40px rgba(0,0,0,0.8);
            transform: translateY(2px);
        }

        .hotspot-sub {
            margin-top: 3px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.3em;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* ===== 标题 ===== */
        .title-zone {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, calc(-50% + 60px));
            z-index: 6;
            text-align: center;
            pointer-events: none;
        }
        .title-main {
            font-size: 2.2rem;
            font-weight: 100;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.4em;
            text-shadow:
                0 0 20px rgba(255,255,255,0.15),
                0 0 50px rgba(100,150,255,0.1);
            white-space: nowrap;
        }
        .title-sub {
            margin-top: 10px;
            font-size: 0.6rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.6em;
        }

        /* ===== 顶部导航 ===== */
        .nav-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .nav-logo {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-decoration: none;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
        }
        .nav-links { display: flex; gap: 16px; }
        .nav-links a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            transition: color 0.3s;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .nav-links a:hover { color: rgba(255,255,255,0.9); }

        .hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255,255,255,0.25);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 3s ease forwards;
            animation-delay: var(--d, 0s);
        }
        @keyframes fadeIn { to { opacity: 1; } }

        /* ===== 星星未点亮提示 Toast（透明背景） ===== */
        .star-toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 100;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            text-align: center;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .star-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .star-toast-icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
            opacity: 0.5;
            color: rgba(200, 220, 255, 0.7);
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.3);
        }
        .star-toast-text {
            font-size: 0.82rem;
            color: rgba(200, 220, 255, 0.75);
            letter-spacing: 0.1em;
            line-height: 1.6;
            white-space: nowrap;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 0, 0, 0.6);
        }

        /* ===== 密码输入弹窗 ===== */
        .pwd-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 200;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .pwd-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .pwd-box {
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }
        .pwd-overlay.show .pwd-box {
            transform: scale(1);
        }
        .pwd-icon {
            font-size: 2rem;
            margin-bottom: 16px;
            color: rgba(150, 200, 255, 0.6);
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.4);
        }
        .pwd-hint {
            font-size: 0.72rem;
            color: rgba(180, 200, 230, 0.5);
            letter-spacing: 0.15em;
            margin-bottom: 20px;
        }
        .pwd-input {
            width: 220px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(120, 180, 255, 0.2);
            border-radius: 8px;
            color: rgba(220, 235, 255, 0.9);
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .pwd-input::placeholder {
            color: rgba(150, 180, 220, 0.3);
            letter-spacing: 0.05em;
        }
        .pwd-input:focus {
            border-color: rgba(120, 180, 255, 0.5);
            box-shadow: 0 0 20px rgba(80, 140, 220, 0.15);
        }
        .pwd-error {
            font-size: 0.7rem;
            color: rgba(255, 120, 120, 0.6);
            margin-top: 12px;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .pwd-error.show {
            opacity: 1;
        }
        .pwd-submit-btn {
            margin-top: 16px;
            padding: 10px 48px;
            background: rgba(120, 180, 255, 0.12);
            border: 1px solid rgba(120, 180, 255, 0.3);
            border-radius: 50px;
            color: rgba(220, 235, 255, 0.85);
            font-size: 0.92rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .pwd-submit-btn:hover {
            background: rgba(120, 180, 255, 0.2);
            border-color: rgba(120, 180, 255, 0.5);
            box-shadow: 0 0 20px rgba(80, 140, 220, 0.2);
            color: rgba(255, 255, 255, 1);
        }
        .pwd-submit-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .title-main { font-size: 1.4rem; letter-spacing: 0.3em; }
            .title-sub { font-size: 0.45rem; letter-spacing: 0.4em; }
            .hotspot-core { width: 10px; height: 10px; box-shadow: 0 0 10px rgba(100,180,255,0.7), 0 0 22px rgba(60,120,255,0.3), 0 0 45px rgba(40,80,200,0.15); }
            .hotspot-core::before { width: 35px; }
            .hotspot-core::after { height: 35px; }
            .hotspot-ring { width: 28px; height: 28px; }
            .hotspot-label { font-size: 0.68rem; letter-spacing: 0.12em; margin-top: 8px; }
            .hotspot-sub { font-size: 0.48rem; }
            .nav-links { gap: 10px; }
            .nav-links a { font-size: 0.66rem; }
            .nav-logo { font-size: 0.78rem; }
            .title-zone { top: 50%; transform: translate(-50%, calc(-50% + 45px)); }
        }
        @media (max-width: 600px) {
            @keyframes hotspotPulse {
                0%, 100% { box-shadow: 0 0 10px rgba(100,180,255,0.7), 0 0 22px rgba(60,120,255,0.3), 0 0 45px rgba(40,80,200,0.15); transform: scale(1); }
                50% { box-shadow: 0 0 14px rgba(100,180,255,0.85), 0 0 30px rgba(60,120,255,0.4), 0 0 55px rgba(40,80,200,0.2); transform: scale(1.12); }
            }
            @keyframes ringExpand {
                0% { width: 10px; height: 10px; opacity: 0.8; }
                100% { width: 45px; height: 45px; opacity: 0; }
            }
            .hotspot.is-active .hotspot-core { box-shadow: 0 0 25px rgba(150,200,255,1), 0 0 55px rgba(60,120,255,0.5); }
        }
    </style>
</head>
<body>

    <!-- 加载占位背景（图片加载前显示） -->
    <div class="loading-bg" id="loadingBg"></div>
    <!-- 真实银河系照片背景（两张轮播） -->
    <div class="galaxy-bg" id="galaxyBg"></div>
    <div class="galaxy_bg2" id="galaxyBg2"></div>
    <div class="vignette"></div>

    <!-- Canvas 星空叠加 -->
    <canvas id="starfield"></canvas>
<!-- 顶部导航已移除，纯沉浸式星空 -->


    <!-- 功能热点 -->
    <div class="hotspot-layer fade-in" style="--d: 0.8s;">
        <a href="board.html" class="hotspot" data-orbit-angle="0" data-orbit-radius="1.6" data-orbit-tilt="0.32">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">留言板</span>
            <span class="hotspot-sub">MESSAGE</span>
        </a>
        <a href="javascript:void(0)" class="hotspot" data-orbit-angle="1.05" data-orbit-radius="1.7" data-orbit-tilt="0.32" data-locked="true">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">屿语</span>
            <span class="hotspot-sub">WHISPERS</span>
        </a>
        <a href="yu.html#capsule" class="hotspot" data-orbit-angle="2.09" data-orbit-radius="1.55" data-orbit-tilt="0.32">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">时间胶囊</span>
            <span class="hotspot-sub">CAPSULE</span>
        </a>
        <a href="about.html" class="hotspot" data-orbit-angle="3.14" data-orbit-radius="1.7" data-orbit-tilt="0.32">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">关于</span>
            <span class="hotspot-sub">ABOUT</span>
        </a>
        <a href="https://sevrenvale.cn" target="_blank" rel="noopener" class="hotspot" data-orbit-angle="4.19" data-orbit-radius="1.6" data-orbit-tilt="0.32">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">情深缘浅</span>
            <span class="hotspot-sub">SEVRENVALE</span>
        </a>
        <a href="bottle.html" class="hotspot" data-orbit-angle="5.24" data-orbit-radius="1.65" data-orbit-tilt="0.32">
            <div class="hotspot-core">
                <div class="hotspot-ring"></div>
            </div>
            <span class="hotspot-label">漂流瓶</span>
            <span class="hotspot-sub">DRIFTING</span>
        </a>
    </div>

    <!-- 标题 -->
    <div class="title-zone fade-in" style="--d: 0.5s;">
        <div class="title-main">望 潮</div>
        <div class="title-sub">WANG CHAO</div>
    </div>

    <div class="hint fade-in" style="--d: 2s;">点击光点探索 · 漂浮在银河中</div>

    <!-- 星星未点亮提示 -->
    <div class="star-toast" id="starToast">
        <div class="star-toast-icon">✦</div>
        <div class="star-toast-text">这颗星星还不能被点亮<br>去试试其它的星星吧</div>
    </div>

    <!-- 密码输入弹窗 -->
    <div class="pwd-overlay" id="pwdOverlay">
        <div class="pwd-box">
            <div class="pwd-icon">✧</div>
            <div class="pwd-hint">输入密码以点亮这颗星星</div>
            <input type="password" class="pwd-input" id="pwdInput" placeholder="• • • • • • • •" autocomplete="off" enterkeyhint="go" />
            <div class="pwd-error" id="pwdError">密码错误，星星无法被点亮</div>
            <button class="pwd-submit-btn" id="pwdSubmitBtn">确认</button>
        </div>
    </div>

    <script>
        // ===== 背景图片预加载 =====
        const bg1 = document.getElementById('galaxyBg');
        const bg2 = document.getElementById('galaxyBg2');
        const loadingBg = document.getElementById('loadingBg');
        let imagesLoaded = 0;
        const totalImages = 2;

        function onImageLoaded() {
            imagesLoaded++;
            if (imagesLoaded >= totalImages) {
                // 两张图都加载完，淡入背景并隐藏占位
                bg1.classList.add('loaded');
                setTimeout(() => loadingBg.classList.add('hide'), 100);
            }
        }

        const img1 = new Image();
        img1.onload = onImageLoaded;
        img1.onerror = onImageLoaded; // 出错也继续
        img1.src = 'galaxy_bg.jpg';

        const img2 = new Image();
        img2.onload = onImageLoaded;
        img2.onerror = onImageLoaded;
        img2.src = 'galaxy_bg2.jpg';

        // ===== 背景轮播 =====
        let bgToggle = false;
        function rotateBg() {
            bgToggle = !bgToggle;
            if (bg1.classList.contains('loaded')) {
                bg1.style.opacity = bgToggle ? '0' : '1';
                bg2.style.opacity = bgToggle ? '0.85' : '0';
            }
        }
        setInterval(rotateBg, 15000);

        // ===== Canvas 星空 =====
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let bigStars = [];
        let shootingStars = [];
        let t = 0;

        function initStars() {
            // 普通闪烁星（超大密度）
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 1200);
            for (let i = 0; i < count; i++) {
                const ct = Math.random();
                let color;
                if (ct > 0.92) color = '180,210,255';
                else if (ct > 0.78) color = '255,235,200';
                else if (ct > 0.62) color = '255,210,180';
                else color = '255,255,250';

                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.1 + 0.3,
                    baseAlpha: Math.random() * 0.5 + 0.15,
                    twinkleSpeed: Math.random() * 0.022 + 0.004,
                    twinklePhase: Math.random() * Math.PI * 2,
                    color: color
                });
            }

            // 大亮星（密度大幅增加）
            bigStars = [];
            const bigCount = Math.floor((canvas.width * canvas.height) / 30000);
            for (let i = 0; i < bigCount; i++) {
                const ct = Math.random();
                let color;
                if (ct > 0.7) color = '180,210,255';
                else if (ct > 0.4) color = '255,240,210';
                else color = '255,220,200';

                bigStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.3 + 1.3,
                    baseAlpha: Math.random() * 0.35 + 0.5,
                    twinkleSpeed: Math.random() * 0.016 + 0.003,
                    twinklePhase: Math.random() * Math.PI * 2,
                    color: color,
                    spikeAngle: Math.random() * Math.PI
                });
            }
        }

        // ===== 望潮初始化 =====
        let blackHole = null;
        function initBlackHole() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const ehR = Math.min(canvas.width, canvas.height) * 0.055; // 放大事件视界半径
            const diskR = ehR * 4; // 吸积盘外半径

            // 移动端适配：根据屏幕宽度动态调整粒子参数
            const isMobile = canvas.width < 600;
            const pCount = isMobile ? 200 : 280;
            const pSizeMax = isMobile ? 0.75 : 1.8;
            const pSizeBase = isMobile ? 0.35 : 0.8;
            const pBrightMax = isMobile ? 0.4 : 0.3;
            const pBrightBase = isMobile ? 0.8 : 0.65;

            // 生成吸积盘粒子（扩散状）
            const diskParticles = [];
            for (let i = 0; i < pCount; i++) {
                const r = ehR * 1.25 + Math.random() * (diskR - ehR * 1.25);
                const ang = Math.random() * Math.PI * 2;
                diskParticles.push({
                    r: r,
                    angle: ang,
                    speed: 0.0008 + (1 - r / diskR) * 0.0008, // 与板块轨道同速
                    // 扩散：径向漂移速度
                    driftV: Math.random() * 0.03 + 0.005, // 向外漂移（降速匹配）
                    // 垂直偏移（不压扁在同一个平面）
                    yOffset: (Math.random() - 0.5) * ehR * 0.8,
                    size: Math.random() * pSizeMax + pSizeBase,
                    brightness: Math.random() * pBrightMax + pBrightBase,
                    colorType: Math.random(),
                    maxR: diskR * (0.8 + Math.random() * 0.4) // 扩散到不同距离后回收
                });
            }
            blackHole = { cx, cy, ehR, diskR, diskParticles, isMobile };
        }

        function createShootingStar() {
            // 从8个方向随机发射流星
            const dir = Math.floor(Math.random() * 8);
            let x, y, vx, vy;
            const speed = Math.random() * 4 + 7;
            const angleSpread = Math.random() * 0.6 - 0.3; // 微随机偏角

            if (dir === 0) {        // 左→右
                x = -80; y = Math.random() * canvas.height * 0.7;
                vx = speed; vy = speed * 0.3 + angleSpread * speed;
            } else if (dir === 1) { // 右→左
                x = canvas.width + 80; y = Math.random() * canvas.height * 0.7;
                vx = -speed; vy = speed * 0.3 + angleSpread * speed;
            } else if (dir === 2) { // 上→下
                x = Math.random() * canvas.width; y = -80;
                vx = speed * 0.3 + angleSpread * speed; vy = speed;
            } else if (dir === 3) { // 下→上
                x = Math.random() * canvas.width; y = canvas.height + 80;
                vx = speed * 0.3 + angleSpread * speed; vy = -speed;
            } else if (dir === 4) { // 左上→右下
                x = -80; y = -80;
                vx = speed * 0.75; vy = speed * 0.75;
            } else if (dir === 5) { // 右上→左下
                x = canvas.width + 80; y = -80;
                vx = -speed * 0.75; vy = speed * 0.75;
            } else if (dir === 6) { // 左下→右上
                x = -80; y = canvas.height + 80;
                vx = speed * 0.75; vy = -speed * 0.75;
            } else {                // 右下→左上
                x = canvas.width + 80; y = canvas.height + 80;
                vx = -speed * 0.75; vy = -speed * 0.75;
            }

            shootingStars.push({ x, y, vx, vy, life: 1, trail: [], ripples: [], rippleTimer: 0, shocks: [], shockTimer: 0 });
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 普通星
            for (const s of stars) {
                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.35;
                const a = Math.max(0, alpha);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${s.color},${a})`;
                ctx.fill();
            }

            // 大亮星
            for (const s of bigStars) {
                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.4;
                const a = Math.max(0, alpha);
                const c = s.color;

                const haloR = s.r * 6;
                const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, haloR);
                grad.addColorStop(0, `rgba(${c},${a * 0.25})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(s.x, s.y, haloR, 0, Math.PI * 2);
                ctx.fill();

                const spikeLen = s.r * 9 * a;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.spikeAngle + t * 0.0001);

                const sg = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
                sg.addColorStop(0, 'rgba(0,0,0,0)');
                sg.addColorStop(0.48, `rgba(${c},${a * 0.4})`);
                sg.addColorStop(0.5, `rgba(255,255,255,${a * 0.7})`);
                sg.addColorStop(0.52, `rgba(${c},${a * 0.4})`);
                sg.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg;
                ctx.fillRect(-spikeLen, -0.6, spikeLen * 2, 1.2);

                ctx.rotate(Math.PI / 2);
                const sg2 = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
                sg2.addColorStop(0, 'rgba(0,0,0,0)');
                sg2.addColorStop(0.48, `rgba(${c},${a * 0.3})`);
                sg2.addColorStop(0.5, `rgba(255,255,255,${a * 0.5})`);
                sg2.addColorStop(0.52, `rgba(${c},${a * 0.3})`);
                sg2.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg2;
                ctx.fillRect(-spikeLen, -0.5, spikeLen * 2, 1);
                ctx.restore();

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${a})`;
                ctx.fill();
            }

            // ===== 望潮 =====
            if (blackHole) {
                const bh = blackHole;
                const cx = bh.cx, cy = bh.cy, ehR = bh.ehR, diskR = bh.diskR;
                const isMobile = bh.isMobile;

                // 1. 远场弥散光晕（吸积盘整体辉光）
                const farGlow = ctx.createRadialGradient(cx, cy, ehR * 1.5, cx, cy, diskR * 1.5);
                if (isMobile) {
                    farGlow.addColorStop(0, 'rgba(110,80,45,0.05)');
                    farGlow.addColorStop(0.5, 'rgba(55,65,100,0.015)');
                } else {
                    farGlow.addColorStop(0, 'rgba(120,90,50,0.06)');
                    farGlow.addColorStop(0.5, 'rgba(60,80,120,0.02)');
                }
                farGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = farGlow;
                ctx.beginPath();
                ctx.arc(cx, cy, diskR * 1.5, 0, Math.PI * 2);
                ctx.fill();

                // 2. 吸积盘粒子（扩散状）
                ctx.save();
                ctx.translate(cx, cy);

                for (const p of bh.diskParticles) {
                    p.angle += p.speed;
                    p.r += p.driftV; // 径向向外漂移
                    if (p.r > p.maxR) {
                        // 回收：重置到内侧
                        p.r = ehR * 1.25;
                        p.angle = Math.random() * Math.PI * 2;
                        p.yOffset = (Math.random() - 0.5) * ehR * 0.8;
                    }

                    // 扩散后亮度随距离衰减
                    const fadeRatio = 1 - (p.r - ehR * 1.25) / (p.maxR - ehR * 1.25);
                    const fadeBoost = 0.25 + fadeRatio * 0.4;
                    const px = Math.cos(p.angle) * p.r;
                    const py = Math.sin(p.angle) * p.r * 0.35 + p.yOffset;

                    // 多普勒效应
                    const doppler = (Math.cos(p.angle) + 1) * 0.5;
                    const doppBase = isMobile ? 0.4 : 0.45;
                    const doppRange = isMobile ? 0.5 : 0.55;
                    const bright = p.brightness * (doppBase + doppler * doppRange) * fadeBoost;

                    // 温度梯度：内侧白热，外侧偏蓝
                    const tRatio = fadeRatio;
                    let r, g, b;
                    if (p.colorType > 0.6) {
                        // 暖色系：金黄到白热
                        r = 255; g = 200 + tRatio * 55; b = 140 + tRatio * 115;
                    } else if (p.colorType > 0.25) {
                        // 橙红色系
                        r = 255; g = 160 + tRatio * 95; b = 80 + tRatio * 175;
                    } else {
                        // 冷色系：蓝白到青蓝
                        r = 140 + tRatio * 115; g = 200 + tRatio * 55; b = 255;
                    }

                    // 粒子柔光层
                    const glowMul = isMobile ? 3.5 : 4;
                    const glowAlpha = isMobile ? 0.4 : 0.45;
                    const glowGrad = ctx.createRadialGradient(px, py, 0, px, py, p.size * glowMul);
                    glowGrad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${bright * glowAlpha})`);
                    glowGrad.addColorStop(1, `rgba(${r|0},${g|0},${b|0},0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * glowMul, 0, Math.PI * 2);
                    ctx.fill();

                    // 粒子主体
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${bright})`;
                    ctx.fill();

                    // 粒子辐射散光：沿径向向外拖尾，渐淡消失
                    const radDir = p.r > 0 ? 1 : 1; // 径向方向（始终向外）
                    const radTailLen = p.size * (isMobile ? 6 : 10) * (0.5 + fadeRatio * 0.5);
                    const radTx = px - Math.cos(p.angle) * radTailLen;
                    const radTy = py - Math.sin(p.angle) * radTailLen * 0.35;
                    const radGrad = ctx.createLinearGradient(radTx, radTy, px, py);
                    radGrad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},0)`);
                    radGrad.addColorStop(0.5, `rgba(${r|0},${g|0},${b|0},${bright * 0.08})`);
                    radGrad.addColorStop(1, `rgba(${r|0},${g|0},${b|0},${bright * 0.2})`);
                    ctx.strokeStyle = radGrad;
                    ctx.lineWidth = p.size * 1.5;
                    ctx.beginPath();
                    ctx.moveTo(radTx, radTy);
                    ctx.lineTo(px, py);
                    ctx.stroke();

                    // 辐射散光光晕（沿径向扩散）
                    const radGlowR = p.size * (isMobile ? 2.5 : 3.5);
                    const radGlowCx = px + Math.cos(p.angle) * p.size * 0.5;
                    const radGlowCy = py + Math.sin(p.angle) * p.size * 0.5 * 0.35;
                    const radGlowGrad = ctx.createRadialGradient(radGlowCx, radGlowCy, 0, radGlowCx, radGlowCy, radGlowR);
                    radGlowGrad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${bright * 0.15})`);
                    radGlowGrad.addColorStop(1, `rgba(${r|0},${g|0},${b|0},0)`);
                    ctx.fillStyle = radGlowGrad;
                    ctx.beginPath();
                    ctx.arc(radGlowCx, radGlowCy, radGlowR, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 3. 引力透镜光环（上方半弧 - 背面吸积盘被弯曲到正面）
                ctx.save();
                ctx.translate(cx, cy);
                const lensR = ehR * 1.3;
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = `rgba(255,220,170,0.4)`;
                ctx.beginPath();
                ctx.arc(0, 0, lensR, Math.PI * 0.92, Math.PI * 2.08);
                ctx.stroke();
                // 内侧光子环
                ctx.lineWidth = 0.6;
                ctx.strokeStyle = `rgba(255,255,255,0.2)`;
                ctx.beginPath();
                ctx.arc(0, 0, lensR * 0.95, Math.PI * 0.92, Math.PI * 2.08);
                ctx.stroke();
                ctx.restore();

                // 4. 事件视界（纯黑核心 + 边缘渐变消隐）
                const ehGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, ehR * 1.12);
                ehGrad.addColorStop(0, 'rgba(0,0,0,1)');
                ehGrad.addColorStop(0.80, 'rgba(0,0,0,1)');
                ehGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = ehGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, ehR * 1.12, 0, Math.PI * 2);
                ctx.fill();

                // 5. 望潮边缘描线（上粗下细，下半圆也描上）
                ctx.save();
                ctx.translate(cx, cy);
                const edgeR = ehR * 1.08;
                const segs = 64;
                for (let i = 0; i < segs; i++) {
                    const a1 = (i / segs) * Math.PI * 2;
                    const a2 = ((i + 1) / segs) * Math.PI * 2;
                    // sin(a): 顶部(3PI/2)=-1, 底部(PI/2)=1
                    const vertPos = Math.sin((a1 + a2) / 2); // -1(顶) ~ 1(底)
                    // 上粗下细，但底部保持可见（不归零）
                    const thickness = 3.5 - (vertPos + 1) * 1.3; // 顶部3.5 → 底部0.9
                    const alpha = 0.7 - (vertPos + 1) * 0.25;   // 顶部0.7 → 底部0.2

                    ctx.lineWidth = thickness;
                    ctx.strokeStyle = `rgba(255,235,200,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, edgeR, a1, a2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 流星
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.trail.push({ x: ss.x, y: ss.y });
                if (ss.trail.length > 20) ss.trail.shift();

                // 沿运动方向生成3D光环
                ss.rippleTimer++;
                if (ss.rippleTimer % 9 === 0 && ss.life > 0.3) {
                    const angle = Math.atan2(ss.vy, ss.vx);
                    ss.ripples.push({ x: ss.x, y: ss.y, life: 1, angle: angle });
                }

                // 绘制3D光环
                for (let k = ss.ripples.length - 1; k >= 0; k--) {
                    const rp = ss.ripples[k];
                    const rpLife = rp.life;
                    const rpRadius = (1 - rpLife) * 32 + 3;

                    // 椭圆光环主体（3D透视效果）
                    const ringW = rpRadius * 1.6;
                    const ringH = rpRadius * 0.55;

                    ctx.save();
                    ctx.translate(rp.x, rp.y);
                    ctx.rotate(rp.angle);

                    // 外层柔光
                    const outerGrad = ctx.createRadialGradient(0, 0, ringH * 0.8, 0, 0, ringW);
                    outerGrad.addColorStop(0, `rgba(100,180,255,0)`);
                    outerGrad.addColorStop(0.7, `rgba(100,180,255,${rpLife * 0.1})`);
                    outerGrad.addColorStop(1, 'rgba(100,180,255,0)');
                    ctx.fillStyle = outerGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 主光环线 - 透视椭圆
                    ctx.lineWidth = 1.2 * rpLife;
                    ctx.strokeStyle = `rgba(140,200,255,${rpLife * 0.4})`;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // 高光弧（3D球体上半部反光）
                    ctx.lineWidth = 1.5 * rpLife;
                    ctx.strokeStyle = `rgba(255,255,255,${rpLife * 0.28})`;
                    ctx.beginPath();
                    ctx.ellipse(0, -ringH * 0.35, ringW * 0.78, ringH * 0.78, 0, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();

                    // 底部暗影弧（3D球体下半部暗面）
                    ctx.lineWidth = 0.8 * rpLife;
                    ctx.strokeStyle = `rgba(60,100,180,${rpLife * 0.14})`;
                    ctx.beginPath();
                    ctx.ellipse(0, ringH * 0.35, ringW * 0.78, ringH * 0.78, 0, Math.PI * 0.15, Math.PI * 0.85);
                    ctx.stroke();

                    ctx.restore();

                    rp.life -= 0.03;
                    if (rp.life <= 0) ss.ripples.splice(k, 1);
                }

                // ===== 冲破气浪效果 =====
                ss.shockTimer++;
                if (ss.shockTimer % 7 === 0 && ss.life > 0.25) {
                    const angle = Math.atan2(ss.vy, ss.vx);
                    ss.shocks.push({ x: ss.x, y: ss.y, life: 1, angle: angle });
                }

                for (let k = ss.shocks.length - 1; k >= 0; k--) {
                    const sh = ss.shocks[k];
                    const sLife = sh.life;
                    const sRadius = (1 - sLife) * 18 + 4;

                    ctx.save();
                    ctx.translate(sh.x, sh.y);
                    ctx.rotate(sh.angle);

                    // 弓形激波前缘（前方亮弧）
                    const bowR = sRadius * 1.2;
                    ctx.lineWidth = 1.5 * sLife;
                    ctx.strokeStyle = `rgba(180,220,255,${sLife * 0.3})`;
                    ctx.beginPath();
                    ctx.ellipse(-sRadius * 0.3, 0, bowR, bowR * 0.7, 0, -Math.PI * 0.75, -Math.PI * 0.25);
                    ctx.stroke();

                    // 两侧气浪扩散（单层，去掉远层翼弧减负）
                    ctx.lineWidth = 1.0 * sLife;
                    ctx.strokeStyle = `rgba(120,180,255,${sLife * 0.18})`;
                    ctx.beginPath();
                    ctx.ellipse(-sRadius * 0.5, 0, sRadius * 1.8, sRadius * 1.1, 0, -Math.PI * 0.88, -Math.PI * 0.62);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(-sRadius * 0.5, 0, sRadius * 1.8, sRadius * 1.1, 0, -Math.PI * 0.38, -Math.PI * 0.12);
                    ctx.stroke();

                    ctx.restore();

                    sh.life -= 0.05;
                    if (sh.life <= 0) ss.shocks.splice(k, 1);
                }

                for (let j = 0; j < ss.trail.length; j++) {
                    const tr = ss.trail[j];
                    const fade = (j / ss.trail.length) * ss.life;
                    ctx.beginPath();
                    ctx.arc(tr.x, tr.y, 1.8 * (j / ss.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${fade * 0.7})`;
                    ctx.fill();
                }

                const grad = ctx.createRadialGradient(ss.x, ss.y, 0, ss.x, ss.y, 14);
                grad.addColorStop(0, `rgba(255,255,255,${ss.life * 0.6})`);
                grad.addColorStop(0.3, `rgba(200,220,255,${ss.life * 0.25})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${ss.life})`;
                ctx.fill();

                ss.x += ss.vx;
                ss.y += ss.vy;
                ss.life -= 0.006;

                if (ss.life <= 0 || ss.x < -150 || ss.x > canvas.width + 150) {
                    shootingStars.splice(i, 1);
                }
            }
        }

        function animate() {
            drawCanvas();
            updateOrbits();
            t++;
            requestAnimationFrame(animate);
        }

        setInterval(() => {
            if (Math.random() > 0.6 && shootingStars.length < 3) {
                createShootingStar();
            }
        }, 4500);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            initBlackHole();
        }

        // ===== 板块星星轨道系统 =====
        const orbitHotspots = document.querySelectorAll('.hotspot[data-orbit-angle]');
        const orbitState = [];

        orbitHotspots.forEach((h) => {
            orbitState.push({
                el: h,
                angle: parseFloat(h.dataset.orbitAngle) || 0,
                radiusMul: parseFloat(h.dataset.orbitRadius) || 1.6,
                tilt: parseFloat(h.dataset.orbitTilt) || 0.32,
            });
        });

        function updateOrbits() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const baseR = Math.min(canvas.width, canvas.height) * 0.19; // 轨道基础半径

            for (const o of orbitState) {
                // 极慢旋转 — 0.0008 rad/frame ≈ 0.046°/帧
                o.angle += 0.0008;
                if (o.angle > Math.PI * 2) o.angle -= Math.PI * 2;

                const r = baseR * o.radiusMul;
                // 椭圆轨道：水平全径，垂直乘以 tilt（与吸积盘倾斜一致）
                const x = cx + Math.cos(o.angle) * r;
                const y = cy + Math.sin(o.angle) * r * o.tilt;

                // 深度感：sin(angle) < 0 表示在轨道远端（背面），缩小+变暗
                const depth = Math.sin(o.angle); // -1（远端） ~ 1（近端）
                const scale = 0.7 + (depth + 1) * 0.15; // 0.7 ~ 1.0
                const opacity = 0.55 + (depth + 1) * 0.225; // 0.55 ~ 1.0

                // 用 transform3d 替代 left/top，避免布局重排
                o.el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
                o.el.style.opacity = opacity.toFixed(3);
                o.el.style.zIndex = depth > 0 ? 6 : 4; // 近端在上层
            }
        }

        // 初始定位一次（resize 之后 canvas 尺寸才正确）
        resize();
        updateOrbits();
        animate();
        window.addEventListener('resize', resize);

        // 等初始定位完成后再启动轨道（略延迟让 fade-in 先走）
        setTimeout(updateOrbits, 100); // 只执行一次初始定位，后续由 animate 驱动

        function resetHotspots() {
            document.querySelectorAll('.hotspot').forEach(h => {
                h.classList.remove('is-active');
            });
        }

        document.querySelectorAll('.hotspot').forEach(h => {
            // 触摸开始：添加 active 状态
            h.addEventListener('touchstart', (e) => {
                resetHotspots();
                e.currentTarget.classList.add('is-active');
            }, { passive: true });

            // 鼠标进入（桌面端）
            h.addEventListener('mouseenter', (e) => {
                e.currentTarget.classList.add('is-active');
            });

            // 鼠标离开（桌面端）
            h.addEventListener('mouseleave', (e) => {
                e.currentTarget.classList.remove('is-active');
            });
        });

        // ===== 屿语板块锁定 + 暗门入口 =====
        const starToast = document.getElementById('starToast');
        let toastTimer = null;
        let lockedClickCount = 0;
        let lockedClickTimer = null;

        function showStarToast() {
            if (toastTimer) clearTimeout(toastTimer);
            starToast.classList.add('show');
            toastTimer = setTimeout(() => starToast.classList.remove('show'), 1500);
        }

        // 密码弹窗
        const pwdOverlay = document.getElementById('pwdOverlay');
        const pwdInput = document.getElementById('pwdInput');
        const pwdError = document.getElementById('pwdError');
        const pwdSubmitBtn = document.getElementById('pwdSubmitBtn');
        const PASSWORD = 'hmj1314520';

        function showPwdOverlay() {
            pwdOverlay.classList.add('show');
            pwdError.classList.remove('show');
            pwdInput.value = '';
            setTimeout(() => pwdInput.focus(), 300);
        }

        function hidePwdOverlay() {
            pwdOverlay.classList.remove('show');
            pwdError.classList.remove('show');
            pwdInput.value = '';
        }

        // 密码验证函数
        function verifyPassword() {
            if (pwdInput.value === PASSWORD) {
                hidePwdOverlay();
                window.location.href = 'yu.html';
            } else {
                pwdError.classList.add('show');
                pwdInput.value = '';
                pwdInput.focus();
            }
        }

        // 输入密码后回车验证
        pwdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === 'Go' || e.keyCode === 13) {
                e.preventDefault();
                verifyPassword();
            }
        });

        // 点击确认按钮验证
        pwdSubmitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            verifyPassword();
        });

        // 点击遮罩空白处关闭密码弹窗
        pwdOverlay.addEventListener('click', (e) => {
            if (e.target === pwdOverlay) {
                hidePwdOverlay();
            }
        });

        document.querySelectorAll('.hotspot[data-locked="true"]').forEach(h => {
            h.addEventListener('click', (e) => {
                e.preventDefault();
                showStarToast();

                // 暗门：快速连点 5 次弹出密码界面
                lockedClickCount++;
                if (lockedClickTimer) clearTimeout(lockedClickTimer);
                lockedClickTimer = setTimeout(() => { lockedClickCount = 0; }, 1200);

                if (lockedClickCount >= 5) {
                    lockedClickCount = 0;
                    showPwdOverlay();
                }
            });
        });

        // 暗门：URL hash #whispers 直接进入
        if (window.location.hash === '#whispers') {
            window.location.href = 'yu.html';
        }

        // 返回页面时重置所有光点
        window.addEventListener('pageshow', () => {
            resetHotspots();
        });

        // ===== 周期性扩散光圈波纹 =====
        function emitRipple(hotspot) {
            const core = hotspot.querySelector('.hotspot-core');
            if (!core) return;
            const ripple = document.createElement('div');
            ripple.className = 'hotspot-ripple';
            core.appendChild(ripple);
            // 动画结束后自动移除
            ripple.addEventListener('animationend', () => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            });
            // 安全兜底：6.5s 后强制移除
            setTimeout(() => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            }, 6500);
        }

        const hotspots = document.querySelectorAll('.hotspot');
        // 每个光点错开发射节奏，营造不同步的扩散感
        hotspots.forEach((h, i) => {
            // 首次延迟不同，让各光点波纹错开
            const initialDelay = i * 1800;
            setTimeout(() => {
                emitRipple(h);
                // 之后每隔 8 秒发射一次
                setInterval(() => {
                    emitRipple(h);
                }, 8000);
            }, initialDelay);
        });
    </script>

</body>
</html>
