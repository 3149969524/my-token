<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #666;
            --white: #fff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background: var(--light);
            min-height: 100vh;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 20px;
        }
        .navbar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        .navbar-logo {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
        }
        .navbar-links {
            display: flex;
            gap: 8px;
        }
        .navbar-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .navbar-links a:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .navbar-links a.active { color: #fff; background: rgba(255,255,255,0.15); }

        /* ===== Hero 区域 ===== */
        .hero {
            background: var(--gradient);
            color: var(--white);
            text-align: center;
            padding: 80px 20px 70px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: heroMove 20s linear infinite;
        }
        @keyframes heroMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }
        .hero-content { position: relative; z-index: 2; }
        .hero h1 { font-size: 2.8rem; margin-bottom: 12px; }
        .hero p { font-size: 1.15rem; opacity: 0.9; max-width: 500px; margin: 0 auto 25px; }
        .hero-btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.4);
            transition: all 0.3s;
        }
        .hero-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }

        /* ===== 卡片区域 ===== */
        .cards-section {
            max-width: 800px;
            margin: -40px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: var(--shadow);
            text-align: center;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .card-icon { font-size: 2.5rem; margin-bottom: 14px; }
        .card h3 { font-size: 1.15rem; margin-bottom: 8px; }
        .card p { color: var(--gray); font-size: 0.88rem; }

        /* ===== 介绍区域 ===== */
        .about-section {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            text-align: center;
        }
        .about-section h2 { font-size: 1.6rem; margin-bottom: 16px; }
        .about-section p { color: #555; font-size: 1rem; margin-bottom: 12px; }

        /* ===== 页脚 ===== */
        .footer { text-align: center; color: var(--gray); padding: 40px 20px; font-size: 0.85rem; background: #fff; border-top: 1px solid #eee; }
        .footer p { user-select: none; -webkit-user-select: none; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .navbar-links a { padding: 6px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">我的网站</a>
            <div class="navbar-links">
                <a href="index.html" class="active">首页</a>
                <a href="board.html">留言板</a>
                <a href="about.html">关于</a>
            </div>
        </div>
    </nav>

    <!-- ===== Hero ===== -->
    <header class="hero">
        <div class="hero-content">
            <h1>欢迎来到我的网站</h1>
            <p>这是一个由个人搭建的小小空间，你可以在这里留言、闲逛、认识我。</p>
            <a href="board.html" class="hero-btn">去留言板看看</a>
        </div>
    </header>

    <!-- ===== 功能卡片 ===== -->
    <section class="cards-section">
        <div class="cards-grid">
            <a href="board.html" class="card">
                <h3>留言板</h3>
                <p>留下你想说的话，实时更新</p>
            </a>
            <a href="about.html" class="card">
                <h3>关于本站</h3>
                <p>了解这个网站的来历</p>
            </a>
            <a href="board.html" class="card">
                <h3>实时互动</h3>
                <p>留言即时显示给所有人</p>
            </a>
        </div>
    </section>

    <!-- ===== 介绍 ===== -->
    <section class="about-section">
        <h2>你好呀</h2>
        <p>这个网站托管在 GitHub Pages 上，完全免费运行。</p>
        <p>没有服务器、没有数据库，所有留言数据都安全地存储在 GitHub 仓库里。</p>
        <p>如果你有什么想对我说的，就去留言板写两句吧！</p>
    </section>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <p>我的个人网站 · 留言板 · 关于 · 永久在线</p>
    </footer>

</body>
</html>
